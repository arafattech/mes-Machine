<ui5-dialog
  class="w-[820px] max-w-[95vw]"
  [open]="open"
  header-text="Receive Quantity"
  i18n-header-text
  (before-close)="closeDialog()"
>
  <ui5-busy-indicator class="w-full" [delay]="0" [active]="loading">
    <section class="w-full flex flex-row gap-4 p-1">
      <div class="flex-1 min-w-0 flex flex-col gap-3">
        <ui5-title level="H6" i18n>Overview</ui5-title>
        <div class="flex flex-col">
          <ui5-label show-colon i18n>MRR</ui5-label>
          <ui5-input class="w-full" [value]="mrrLabel" readonly></ui5-input>
        </div>

        <div class="flex flex-col">
          <ui5-label show-colon i18n>Product</ui5-label>
          <ui5-input class="w-full" [value]="productName" readonly></ui5-input>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="flex flex-col">
            <ui5-label show-colon i18n>Required Qty</ui5-label>
            <ui5-input class="w-full" [value]="requiredQuantity + ''" readonly></ui5-input>
          </div>
          <div class="flex flex-col">
            <ui5-label show-colon i18n>Received Qty</ui5-label>
            <ui5-input class="w-full" [value]="receivedQuantity + ''" readonly></ui5-input>
          </div>
        </div>

        <div class="flex flex-col">
          <ui5-label show-colon required i18n>Receiving Qty</ui5-label>
          <ui5-step-input
            class="w-full"
            [value]="receivingQuantity"
            [min]="0"
            [max]="remainingQuantity"
            [step]="1"
            [attr.value-state]="isOverLimit ? 'Negative' : 'None'"
            (change)="onReceivingQuantityChange($event)"
          >
            <div slot="valueStateMessage" i18n>Exceeds remaining quantity ({{ remainingQuantity }})</div>
          </ui5-step-input>
        </div>
      </div>

      @if (hasLot) {
        <div class="flex-1 min-w-0 border-l pl-4 flex flex-col gap-3">
          <ui5-title level="H6" i18n>Lot Information</ui5-title>
          <div class="flex flex-col">
            <ui5-label show-colon i18n>Lot No</ui5-label>
            <ui5-input class="w-full" [value]="lotNumber" readonly></ui5-input>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="flex flex-col">
              <ui5-label show-colon i18n>Bale Qty (this receipt)</ui5-label>
              <ui5-input type="Number" class="w-full" [value]="lotDraft.bale_quantity + ''" (change)="lotDraft.bale_quantity = +$any($event.target).value"></ui5-input>
            </div>
            <div class="flex flex-col">
              <ui5-label show-colon i18n>Moisture %</ui5-label>
              <ui5-input type="Number" class="w-full" [value]="lotDraft.moisture_pct + ''" readonly></ui5-input>
            </div>
            <div class="flex flex-col">
              <ui5-label show-colon i18n>Gross (kg)</ui5-label>
              <ui5-input type="Number" class="w-full" [value]="lotDraft.gross_weight_kg + ''" readonly></ui5-input>
            </div>
            <div class="flex flex-col">
              <ui5-label show-colon i18n>Tare (kg)</ui5-label>
              <ui5-input type="Number" class="w-full" [value]="lotDraft.tare_weight_kg + ''" readonly></ui5-input>
            </div>
            <div class="flex flex-col">
              <ui5-label show-colon i18n>Net (kg)</ui5-label>
              <ui5-input type="Number" class="w-full" [value]="lotDraft.net_weight_kg + ''" readonly></ui5-input>
            </div>
            <div class="flex flex-col">
              <ui5-label show-colon i18n>Received Date</ui5-label>
              <ui5-date-picker class="w-full" format-pattern="yyyy-MM-dd" [value]="lotDraft.received_date ?? ''" readonly></ui5-date-picker>
            </div>
            <div class="flex flex-col">
              <ui5-label show-colon i18n>Status</ui5-label>
              <ui5-input class="w-full" [value]="lotDraft.status" readonly></ui5-input>
            </div>
            <div class="flex flex-col">
              <ui5-label show-colon i18n>Avg Weight / Bale (kg)</ui5-label>
              <ui5-input class="w-full" [value]="avgWeightPerBale" readonly></ui5-input>
            </div>
            <div class="flex flex-col col-span-2">
              <ui5-label show-colon i18n>Remarks</ui5-label>
              <ui5-input class="w-full" [value]="lotDraft.remarks ?? ''" readonly></ui5-input>
            </div>
          </div>
        </div>
      }
    </section>
  </ui5-busy-indicator>
  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      (click)="save()"
      [disabled]="!canSubmit"
      text="{{ localization.Submit }}"
    ></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="loading"
      (click)="closeDialog()"
      text="{{ localization.Cancel }}"
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
