<div class="h-[calc(100vh-50px)] overflow-hidden">
  <app-ag-grid-table
    #agGridRef
    [columns]="columns"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    [displayConfig]="displayConfig"
    gridId="item-return-list"
    [enableRowClick]="false"
    (newButtonClick)="newItemReturn()"
  ></app-ag-grid-table>
</div>

<app-item-return-form
  #itemReturnForm
  (saveEvent)="saveEvent()"
></app-item-return-form>
