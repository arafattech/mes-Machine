<div class="h-[calc(100vh-50px)] overflow-hidden">
  <app-ag-grid-table
    #agGridRef
    [columns]="columns"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    [displayConfig]="displayConfig"
    gridId="item-inventory-list"
    (downloadButtonClick)="downloadData($event)"
  ></app-ag-grid-table>
</div>

<app-item-details
  #itemForm
  [saveMode]="saveMode"
  [isclone]="clone"
  [product]="product"
  (RefreshTable)="processData($event)"
  (isSuccessChange)="processData($event)"
></app-item-details>
