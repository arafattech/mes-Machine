<div class="d-flex w-100">
  <div *ngIf="!isMobileView">
    <ui5-side-navigation #sidenav [collapsed]="isCollapsed" class="nav_side">

      <ui5-side-navigation-item text="{{ home }}" icon="business-suite/3d" routerLink="/"
        routerLinkActive="active-link">
      </ui5-side-navigation-item>

      <ui5-side-navigation-item text="{{ analytics.name }}" icon="bbyd-dashboard"
        *ngIf="permissions[analytics.permissions]" [routerLink]="analytics.route" routerLinkActive="active-link">
      </ui5-side-navigation-item>

      <ui5-side-navigation-item *ngFor="let item of topMenu" [text]="item.text" [icon]="item.icon"
        [routerLink]="item.routerLink" routerLinkActive="active-link">
      </ui5-side-navigation-item>

      <ui5-side-navigation-group *ngFor="let group of sidebarMenu" [text]="group.text" [expanded]="group.expanded">
        <ng-container *ngFor="let item of group.items">
          <ui5-side-navigation-item *ngIf="
              !item.permission || (permissions && permissions[item.permission])
            " [text]="item.text" [icon]="item.icon" [routerLink]="item.routerLink" unselectable
            [expanded]="item.expanded" (click)="toggleExpand(item)">
            <ng-container *ngFor="let subItem of item.subItems">
              <ui5-side-navigation-sub-item *ngIf="
                  !subItem.permission ||
                  (permissions && permissions[subItem.permission])
                " [text]="subItem.text" [routerLink]="subItem.routerLink"
                (click)="$event.stopPropagation()"></ui5-side-navigation-sub-item>
            </ng-container>
          </ui5-side-navigation-item>
        </ng-container>
      </ui5-side-navigation-group>
    </ui5-side-navigation>
  </div>
  <div class="w-100 pt-1 pe-1 overflow-auto">
    <router-outlet></router-outlet>
  </div>
</div>

<ui5-popover *ngIf="isMobileView" [open]="isOpened" opener="SettingsNav" placement="Bottom" (close)="onClosePopover()">
  <ui5-side-navigation>
    <ui5-side-navigation-item text="{{ analytics.name }}" icon="home" (click)="onLoad()" unselectable
      routerLinkActive="active-link">
    </ui5-side-navigation-item>
    <ui5-side-navigation-item text="{{ dashboard }}" icon="business-suite/3d" routerLink="/store-management"
      routerLinkActive="active-link">
    </ui5-side-navigation-item>

    <ui5-side-navigation-item *ngFor="let item of topMenu" [text]="item.text" [icon]="item.icon"
      [routerLink]="item.routerLink" routerLinkActive="active-link">
    </ui5-side-navigation-item>

    <ui5-side-navigation-group *ngFor="let group of sidebarMenu" [text]="group.text" [expanded]="group.expanded">
      <ng-container *ngFor="let item of group.items">
        <ui5-side-navigation-item *ngIf="
              !item.permission || (permissions && permissions[item.permission])
            " [text]="item.text" [icon]="item.icon" [routerLink]="item.routerLink" unselectable
          [expanded]="item.expanded" (click)="toggleExpand(item)">
          <ng-container *ngFor="let subItem of item.subItems">
            <ui5-side-navigation-sub-item *ngIf="
                  !subItem.permission ||
                  (permissions && permissions[subItem.permission])
                " [text]="subItem.text" [routerLink]="subItem.routerLink"
              (click)="$event.stopPropagation()"></ui5-side-navigation-sub-item>
          </ng-container>
        </ui5-side-navigation-item>
      </ng-container>
    </ui5-side-navigation-group>
  </ui5-side-navigation>
</ui5-popover>
