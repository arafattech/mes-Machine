<div class="h-[calc(100vh-50px)] overflow-hidden">
  <app-ag-grid-table
    #agGridRef
    [columns]="columns"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    [displayConfig]="displayConfig"
    selectionMode="Single"
    gridId="purchese-po-list"
    [segmentButtonItems]="segmentButtonItems"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Purchase Orders Found"
    i18n-IllustratedTitle
    (newButtonClick)="newItem()"
    (segmentButtonChange)="segmentButtonChange($event)"
  ></app-ag-grid-table>
</div>

<ui5-dialog
  [open]="open"
  class="w-[70vw] h-[86vh]"
  [attr.header-text]="dialogHeaderText"
  (before-close)="CloseDialog()"
>
  <ui5-busy-indicator class="w-full h-[72vh]" [delay]="0" [active]="loading">
    <section class="w-[70vw] grid grid-cols-2 gap-3">
      <div class="flex flex-col">
        <ui5-label for="poNo" show-colon i18n>PO No</ui5-label>
        <ui5-input
          id="poNo"
          class="w-full"
          [readonly]="true"
          [(ngModel)]="po.custom_id"
        ></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label for="poDate" show-colon i18n>PO Date</ui5-label>
        <ui5-date-picker
          id="poDate"
          class="w-full"
          [readonly]="isFormLocked"
          format-pattern="dd-MM-yyyy"
          [(ngModel)]="po.po_date"
        ></ui5-date-picker>
      </div>

      <div class="flex flex-col">
        <ui5-label for="poStatus" show-colon i18n>Status</ui5-label>
        <ui5-combobox
          id="poStatus"
          class="w-full"
          [readonly]="isFormLocked"
          [value]="formatStatus(po.status)"
          placeholder="Select Status"
          i18n-placeholder
          (selectionChange)="onStatusChange($event)"
        >
          @for (item of statusOptions; track $index) {
            <ui5-cb-item [text]="item.label" [id]="item.value"></ui5-cb-item>
          }
        </ui5-combobox>
      </div>

      <div class="flex flex-col">
        <ui5-label for="sprList" show-colon i18n>SPR List</ui5-label>
        <ui5-combobox
          id="sprList"
          class="w-full"
          [readonly]="isFormLocked"
          (selectionChange)="onRequisitionChange($event)"
          [value]="requisitionDisplayValue"
          placeholder="Select SPR"
          i18n-placeholder
        >
          @for (item of requisitions; track $index) {
            <ui5-cb-item
              [text]="item.custom_id + ' | ' + item.department?.name"
              [id]="item.id"
            ></ui5-cb-item>
          }
        </ui5-combobox>
      </div>

      <div class="flex flex-col">
        <ui5-label for="supplierList" show-colon i18n>Supplier</ui5-label>
        <ui5-combobox
          id="supplierList"
          class="w-full"
          [readonly]="isFormLocked"
          (selectionChange)="onSupplierChange($event)"
          (change)="checkValidation($event, 'suppliers')"
          [attr.value-state]="valueStateOptions.suppliers"
          [value]="po.supplier?.name || ''"
          placeholder="Select Supplier"
          i18n-placeholder
        >
          @for (item of suppliers; track $index) {
            <ui5-cb-item [text]="item.name" [id]="item.id"></ui5-cb-item>
          }
          <div slot="valueStateMessage">{{ validationMessage }}</div>
        </ui5-combobox>
      </div>

      <div class="flex flex-col col-span-2">
        <ui5-label for="note" show-colon i18n>Note</ui5-label>
        <ui5-textarea
          id="note"
          class="w-full"
          [readonly]="isFormLocked"
          placeholder="Type message..."
          i18n-placeholder
          [(ngModel)]="po.note"
        ></ui5-textarea>
      </div>

      <div class="col-span-2 rounded-lg border border-slate-300 overflow-hidden h-[calc(100vh-500px)]">
        <app-ag-grid-table
          [columns]="itemColumns"
          [dataSource]="itemsDataSource"
          [toolbarConfig]="itemsToolbarConfig"
          [displayConfig]="itemsDisplayConfig"
          gridId="store-po-items"
          selectionMode="Single"
          [showIllustratedMessage]="true"
          IllustratedName="NoEntries"
          [isBase]="true"
          [enableRowClick]="false"
        ></app-ag-grid-table>
      </div>
    </section>
  </ui5-busy-indicator>
  <ui5-toolbar slot="footer">
    @if (isPending && saveMode === 'PUT') {
      <ui5-toolbar-button
        design="Positive"
        [disabled]="loading"
        (click)="approvePo()"
        i18n-text
        text="Approve"
      ></ui5-toolbar-button>
      <ui5-toolbar-button
        design="Negative"
        [disabled]="loading"
        (click)="rejectPo()"
        i18n-text
        text="Reject"
      ></ui5-toolbar-button>
    }
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="loading"
      (click)="CloseDialog()"
      text="{{ localization.Cancel }}"
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
