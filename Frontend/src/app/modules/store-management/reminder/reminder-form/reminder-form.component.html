<ui5-dialog
  [open]="open"
  class="w-[65vw] h-[90vh]"
  header-text="Reminder"
  i18n-header-text
  (before-close)="CloseDialog()">
  <ui5-busy-indicator class="w-full h-[68vh]" [delay]="0" [active]="loading">
    <section class="w-full flex flex-col gap-3">
      <div class="flex gap-3">
        <div class="flex flex-col w-1/2">
          <ui5-label for="reminderMrr" show-colon required i18n>MRR</ui5-label>
          <ui5-combobox
            id="reminderMrr"
            class="w-full"
            (selectionChange)="onMrrChange($event)"
            placeholder="Select MRR"
            i18n-placeholder
            [value]="mrrTitle"
            [readonly]="context === 'purchase' || viewOnly"
          >
            <ui5-cb-item
              *ngFor="let mrr of mrrOptions"
              [text]="mrr.label"
              [id]="mrr.id"
            ></ui5-cb-item>
            <div slot="valueStateMessage">{{ validationMessage }}</div>
          </ui5-combobox>
        </div>

        <div class="flex flex-col w-1/2">
          <ui5-label for="reminderDate" show-colon required i18n>Reminder Date</ui5-label>
          <ui5-date-picker
            id="reminderDate"
            class="w-full"
            format-pattern="dd-MM-yyyy"
            [(ngModel)]="reminder.reminder_date"
            readonly
          ></ui5-date-picker>
        </div>
      </div>

      <div class="flex flex-col">
        <ui5-label for="reminderMessage" show-colon required i18n>Message</ui5-label>
        <ui5-textarea
          id="reminderMessage"
          class="w-full"
          placeholder="Type message..."
          i18n-placeholder
          [(ngModel)]="reminder.message"
          [readonly]="context === 'purchase' || viewOnly"
        ></ui5-textarea>
      </div>

      <div class="flex flex-col" *ngIf="context === 'purchase' || viewOnly">
        <ui5-checkbox [(ngModel)]="reminder.is_read" [disabled]="viewOnly" text="I have read" i18n-text></ui5-checkbox>
      </div>

      <div class="flex flex-col">
        <ui5-label for="reminderPurchaseMessage" show-colon i18n>Purchase Message</ui5-label>
        <ui5-textarea
          id="reminderPurchaseMessage"
          class="w-full"
          placeholder="Type message..."
          i18n-placeholder
          [(ngModel)]="reminder.purchase_message"
          [readonly]="context === 'store' || viewOnly"
        ></ui5-textarea>
      </div>

      <div class="flex flex-col h-[calc(68vh-240px)] rounded-lg border border-slate-300 pt-4 overflow-hidden">
        <app-ag-grid-table
          [columns]="logColumns"
          [dataSource]="logDataSource"
          [toolbarConfig]="logToolbarConfig"
          [displayConfig]="logDisplayConfig"
          gridId="reminder-product-log"
          [enableRowClick]="false"
        ></app-ag-grid-table>
      </div>
    </section>
  </ui5-busy-indicator>

  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      *ngIf="!viewOnly"
      design="Emphasized"
      [disabled]="loading"
      (click)="save()"
      text="{{ localization.Submit }}"
    ></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="loading"
      (click)="CloseDialog()"
      text="{{ localization.Cancel }}"
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
