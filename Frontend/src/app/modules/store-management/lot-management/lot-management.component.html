<div class="h-[calc(100vh-50px)] overflow-hidden">
  <app-ag-grid-table
    #agGridRef
    [columns]="columns"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    [displayConfig]="displayConfig"
    [showAction]="true"
    selectionMode="Single"
    gridId="store-lots"
    (newButtonClick)="openNew()"
    (editClick)="openEdit($event)"
    (deleteClick)="deleteRow($event)"
  ></app-ag-grid-table>
</div>

<ui5-dialog
  [open]="dialogOpen"
  [attr.header-text]="saveMode === 'POST' ? 'New Lot' : 'Edit Lot'"
  i18n-header-text
  state="Information"
  class="w-[720px] max-w-[95vw]"
  (before-close)="closeDialog()"
>
  <div class="relative w-full h-full">
    <div *ngIf="submitting" class="absolute inset-0 z-10 flex items-center justify-center bg-white/60">
      <div class="h-8 w-8 rounded-full border-4 border-blue-200 border-t-blue-600 animate-spin"></div>
    </div>

    <div class="grid grid-cols-2 gap-3 p-1">
      <div class="flex flex-col">
        <ui5-label show-colon required i18n>Lot No</ui5-label>
        <ui5-input class="w-full" [value]="lot.lot_number" (change)="lot.lot_number = $any($event.target).value"></ui5-input>
      </div>
      <div class="flex flex-col">
        <ui5-label show-colon i18n>Product</ui5-label>
        <ui5-combobox
          placeholder="Search Product"
          i18n-placeholder
          [value]="selectedProductLabel"
          (input)="onProductSearchInput($event)"
          (selectionChange)="onProductChange($event)"
          class="w-full"
        >
          <ui5-cb-item *ngFor="let p of productOptions" [text]="p.product_name" [id]="p.id"></ui5-cb-item>
        </ui5-combobox>
      </div>
      <div class="flex flex-col">
        <ui5-label show-colon i18n>Bale Quantity</ui5-label>
        <ui5-input type="Number" class="w-full" [value]="lot.bale_quantity + ''" (change)="lot.bale_quantity = +$any($event.target).value"></ui5-input>
      </div>
      <div class="flex flex-col">
        <ui5-label show-colon i18n>Received Date</ui5-label>
        <ui5-date-picker class="w-full" format-pattern="yyyy-MM-dd" [value]="lot.received_date ?? ''" (change)="onReceivedDateChange($event)"></ui5-date-picker>
      </div>
      <div class="flex flex-col">
        <ui5-label show-colon i18n>Gross Weight (kg)</ui5-label>
        <ui5-input type="Number" class="w-full" [value]="lot.gross_weight_kg + ''" (change)="onGrossWeightChange($event)"></ui5-input>
      </div>
      <div class="flex flex-col">
        <ui5-label show-colon i18n>Tare Weight (kg)</ui5-label>
        <ui5-input type="Number" class="w-full" [value]="lot.tare_weight_kg + ''" (change)="onTareWeightChange($event)"></ui5-input>
      </div>
      <div class="flex flex-col">
        <ui5-label show-colon i18n>Net Weight (kg)</ui5-label>
        <ui5-input class="w-full" [value]="lot.net_weight_kg + ''" readonly></ui5-input>
      </div>
      <div class="flex flex-col">
        <ui5-label show-colon i18n>Moisture %</ui5-label>
        <ui5-input type="Number" class="w-full" [value]="lot.moisture_pct + ''" (change)="lot.moisture_pct = +$any($event.target).value"></ui5-input>
      </div>
      <div class="flex flex-col">
        <ui5-label show-colon i18n>Status</ui5-label>
        <ui5-select class="w-full" (change)="onStatusChange($event)">
          <ui5-option value="IN_STOCK" [selected]="lot.status === 'IN_STOCK'" i18n>In Stock</ui5-option>
          <ui5-option value="ISSUED" [selected]="lot.status === 'ISSUED'" i18n>Issued</ui5-option>
          <ui5-option value="ON_HOLD" [selected]="lot.status === 'ON_HOLD'" i18n>On Hold</ui5-option>
          <ui5-option value="REJECTED" [selected]="lot.status === 'REJECTED'" i18n>Rejected</ui5-option>
        </ui5-select>
      </div>
      <div class="flex flex-col">
        <ui5-label show-colon i18n>Avg Weight / Bale (kg)</ui5-label>
        <ui5-input class="w-full" [value]="avgWeightPerBale" readonly></ui5-input>
      </div>
      <div class="flex flex-col col-span-2">
        <ui5-label show-colon i18n>Remarks</ui5-label>
        <ui5-textarea class="w-full" [rows]="2" [value]="lot.remarks ?? ''" (change)="lot.remarks = $any($event.target).value"></ui5-textarea>
      </div>
    </div>
  </div>

  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      [disabled]="!lot.lot_number || submitting"
      (click)="save()"
      text="Save"
      i18n-text
    ></ui5-toolbar-button>
    <ui5-toolbar-button design="Transparent" [disabled]="submitting" (click)="closeDialog()" text="Cancel" i18n-text></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
