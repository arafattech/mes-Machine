<div class="d-flex w-100">
  <div>
    <ui5-side-navigation #sidenav [collapsed]="isCollapsed">
      <ui5-side-navigation-item
        text="{{ home }}"
        icon="business-suite/3d"
        routerLink="/"
        routerLinkActive="active-link"
      >
      </ui5-side-navigation-item>

      <ui5-side-navigation-item
        text="{{ analytics.name }}"
        icon="bbyd-dashboard"
        *ngIf="permissions[analytics.permissions]"
        [routerLink]="analytics.route"
        routerLinkActive="active-link"
      >
      </ui5-side-navigation-item>

      <ui5-side-navigation-item
        text="{{ forecast.name }}"
        icon="line-chart"
        [routerLink]="forecast.route"
        routerLinkActive="active-link"
      >
      </ui5-side-navigation-item>
      <ui5-side-navigation-group
        *ngFor="let group of sidebarMenu"
        [text]="group.text"
        [expanded]="group.expanded"
      >
        <ng-container *ngFor="let item of group.items">
          <ui5-side-navigation-item
            *ngIf="
              !item.permission || (permissions && permissions[item.permission])
            "
            [text]="item.text"
            [icon]="item.icon"
            [routerLink]="item.routerLink"
            unselectable
            [expanded]="item.expanded"
            (click)="toggleExpand(item)"
          >
            <ng-container *ngFor="let subItem of item.subItems">
              <ui5-side-navigation-sub-item
                *ngIf="
                  !subItem.permission ||
                  (permissions && permissions[subItem.permission])
                "
                [text]="subItem.text"
                [routerLink]="subItem.routerLink"
                (click)="$event.stopPropagation()"
              ></ui5-side-navigation-sub-item>
            </ng-container>
          </ui5-side-navigation-item>
        </ng-container>
      </ui5-side-navigation-group>
    </ui5-side-navigation>
  </div>

  <div class="w-100 pt-1 pe-1 overflow-auto">
    <router-outlet></router-outlet>
  </div>
</div>

<ui5-dialog [attr.header-text]="'Marketing Plan'" [open]="openPlan">
  <ui5-bar slot="header" design="Header">
    <ui5-title level="H5" slot="startContent" i18n>Marketing Plan</ui5-title>
  </ui5-bar>

  <section class="login-form p-2 w-[56vw]">
    <div class="flex flex-col col-span-2 rounded-lg border border-slate-300 pt-2">
      <app-ag-grid-table
        #planGridRef
        [columns]="columns"
        [dataSource]="planDataSource"
        [toolbarConfig]="planToolbarConfig"
        [displayConfig]="planDisplayConfig"
        selectionMode="None"
        [isBase]="false"
        [isTableCacheEnabled]="false"
        [showAction]="false"
        [showIllustratedMessage]="true"
        IllustratedName="NoEntries"
        [singleClickEdit]="true"
        (cellEdited)="onPlanCellEdited($event)"
      ></app-ag-grid-table>
    </div>
  </section>
  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      class="dialogCloser"
      design="Emphasized"
      [text]="'Save'"
      (click)="savePlan()"
    >
    </ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>

<ui5-dialog [open]="isWarning" state="Critical" [attr.header-text]="[localization.Warning]">
    <ui5-busy-indicator class="w-full bg-none h-full" [delay]="0" size="M">
        <p class="w-100 text-center">
            <span  i18n>{{this.warningMessage}}</span>
        </p>
    </ui5-busy-indicator>
    <div slot="footer" class="d-flex justify-content-end align-items-center w-100">

        <ui5-button  (click)="isWarning = false">{{localization.Cancel}}</ui5-button>
    </div>
</ui5-dialog>
