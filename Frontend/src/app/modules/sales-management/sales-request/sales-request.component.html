<app-ag-grid-table
  #agGridRef
  [columns]="columns"
  [dataSource]="dataSource"
  [toolbarConfig]="toolbarConfig"
  [displayConfig]="displayConfig"
  selectionMode="Single"
  [selectionRowBehavior]="'RowOnly'"
  [isBase]="true"
  [showIllustratedMessage]="true"
  IllustratedName="NoData"
></app-ag-grid-table>

<ui5-dialog [open]="isShoWaring" state="Critical">
  <ui5-bar slot="header" design="Header">
    <ui5-title level="H5" slot="startContent">
      {{ waringInfo.title }}
    </ui5-title>
    <ui5-button
      design="Transparent"
      slot="endContent"
      icon="decline"
      (click)="closeWarning()"
    ></ui5-button>
  </ui5-bar>

  <section class="px-4 py-3 text-gray-700">
    <p>{{ waringInfo.message }}</p>
    <div *ngIf="waringInfo.status === 'REJECTED'" class="mt-2">
      <ui5-textarea
        placeholder="Enter rejection note"
        [rows]="3"
        [(ngModel)]="waringInfo.rejectNote"
      ></ui5-textarea>
    </div>
  </section>

  <ui5-bar slot="footer" design="Footer">
    <ui5-button design="Emphasized" slot="endContent" (click)="confirmWarning()" i18n>
      {{ localization.yes }}
    </ui5-button>
    <ui5-button design="Transparent" slot="endContent" (click)="closeWarning()" i18n>
      {{ localization.no }}
    </ui5-button>
  </ui5-bar>
</ui5-dialog>

<ui5-dialog size="L" [open]="isLoading">
  <ui5-busy-indicator text="Loading data.." active [delay]="0">
    <div class="h-[100px] w-[400px]"></div>
  </ui5-busy-indicator>
</ui5-dialog>

<app-order-form #orderFrom [showNewButton]="false"></app-order-form>
