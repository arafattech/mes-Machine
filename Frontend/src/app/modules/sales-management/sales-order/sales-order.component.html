<app-ag-grid-table
  #agGridRef
  [columns]="columns"
  [dataSource]="dataSource"
  [toolbarConfig]="toolbarConfig"
  [displayConfig]="displayConfig"
  selectionMode="Single"
  [selectionRowBehavior]="'RowOnly'"
  [isBase]="true"
  [showIllustratedMessage]="true"
  IllustratedName="NoData"
  (newButtonClick)="newItem()"
  (refreshButtonClick)="restoreTable()"
></app-ag-grid-table>

<app-delete-entity
  [IsDelete]="IsDelete"
  (isSuccess)="updateTable()"
></app-delete-entity>

<app-order-form #orderFrom (saveEvent)="saveEvent()" [isV8]="isv8"></app-order-form>

<ui5-dialog
  [open]="isOpenWarning"
  state="Critical"
  [attr.header-text]="localization.Warning"
>
  {{ localization.salesRequestMessage }}
  <div
    slot="footer"
    class="flex justify-end items-center gap-2 w-full p-3 border-t bg-gray-50"
  >
    <ui5-button
      design="Positive"
      (click)="onStatusChange(SalesOrder, 'action')"
    >
      {{ localization.Submit }}
    </ui5-button>
    <ui5-button design="Default" (click)="isOpenWarning = false">
      {{ localization.Cancel }}
    </ui5-button>
  </div>
</ui5-dialog>

<ui5-dialog size="L" [open]="isLoading">
  <ui5-busy-indicator text="Loading data.." active [delay]="0">
    <div class="h-[100px] w-[400px]"></div>
  </ui5-busy-indicator>
</ui5-dialog>
