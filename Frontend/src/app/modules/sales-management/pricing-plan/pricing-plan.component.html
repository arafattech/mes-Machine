<ui5-card class="card-container">
  <ui5-bar design="Header" accessible-role="Toolbar" slot="header">
    <ui5-title id="basic-label" slot="startContent" level="H5" size="H5" i18n>Pricing Plans</ui5-title>
  </ui5-bar>

  <div class="relative p-2 grid gap-2" [ngClass]="{
			'grid-cols-1': isListCollapsed || isTabCollapsed,
			'grid-cols-2': !isListCollapsed && !isTabCollapsed,
		}">
    <ui5-card>
      <div class="h-[calc(100vh-110px)]" [class.hidden]="isListCollapsed === true">
        <app-ag-grid-table
          #agGridRef
          [columns]="columns"
          [dataSource]="dataSource"
          [toolbarConfig]="toolbarConfig"
          [displayConfig]="displayConfig"
          selectionMode="Single"
          [isBase]="true"
          [showAction]="false"
          [showIllustratedMessage]="true"
          IllustratedName="NoData"
          (newButtonClick)="newItem()"
          (downloadButtonClick)="downloadData($event)"
          (rowClick)="handleRowSelect($event)"
        ></app-ag-grid-table>
        <div class="flex flex-col absolute top-1/2 -translate-x-1/2 -translate-y-1/2 z-50" [ngClass]="{
					'left-[99%]': isTabCollapsed,
					'left-[50%]': !isTabCollapsed,
				}">
          <ui5-avatar class="relative top-[-40px] border border-slate-400 bg-white" [icon]="
          isTabCollapsed ? 'navigation-left-arrow' : 'navigation-right-arrow'
        " interactive size="XS" color-scheme="Placeholder" (click)="onCLickTabCollapsed()"></ui5-avatar>
        </div>
      </div>
    </ui5-card>

    <div [class.hidden]="isTabCollapsed === true">
      <div class="flex flex-col absolute top-1/2 -translate-x-1/2 -translate-y-1/2 z-50" [ngClass]="{
					'left-[1%]': isListCollapsed,
					'left-[50%]': !isListCollapsed,
					'top-[45%]': isListCollapsed,
				}">
        <ui5-avatar class="border border-slate-400 bg-white" [icon]="
          isListCollapsed ? 'navigation-right-arrow' : 'navigation-left-arrow'
        " interactive size="XS" color-scheme="Placeholder" (click)="onCLickListCollapsed()"></ui5-avatar>
      </div>
      <app-pricing-form #itemForm [saveMode]="saveMode" [isclone]="clone" [product]="product"
        (RefreshTable)="processData($event)" (closeFrom)="cancelEdit()" (isSuccessChange)="processData($event)">
      </app-pricing-form>
    </div>
  </div>
</ui5-card>

<app-delete-entity (isSuccess)="processData($event)" [IsDelete]="IsDelete">
</app-delete-entity>

<ui5-dialog size="L" [open]="isLoading">
  <ui5-busy-indicator text="Loading data.." active [delay]="0">
    <div class="h-[100px] w-[400px]"></div>
  </ui5-busy-indicator>
</ui5-dialog>
