<app-ag-grid-table
  #agGridRef
  [columns]="columns"
  [dataSource]="dataSource"
  [toolbarConfig]="toolbarConfig"
  [displayConfig]="displayConfig"
  selectionMode="Single"
  gridId="purchese-quotation-list"
  [showIllustratedMessage]="true"
  IllustratedName="NoData"
  IllustratedTitle="No Quotations Found"
  i18n-IllustratedTitle
  (newButtonClick)="newItem()"
  
></app-ag-grid-table>

<ui5-dialog
  [open]="open"
  class="w-[70vw] h-[86vh]"
  [attr.header-text]="dialogHeaderText"
  (before-close)="CloseDialog()"
>
  <ui5-busy-indicator class="w-full h-[72vh]" [delay]="0" [active]="loading || loadingItems">
    <section class="w-[70vw] grid grid-cols-2 gap-3 p-1">
      @if (warningMessage) {
        <div class="col-span-2">
          <ui5-message-strip design="Negative" (close)="warningMessage = ''">{{ warningMessage }}</ui5-message-strip>
        </div>
      }
      <div class="flex flex-col">
        <ui5-label for="rfqNo" show-colon i18n>RFQ No</ui5-label>
        <ui5-input id="rfqNo" class="w-full" [readonly]="true" [(ngModel)]="quote.custom_id"></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label for="quoteDate" show-colon i18n>Quote Date</ui5-label>
        <ui5-date-picker
          id="quoteDate"
          class="w-full"
          format-pattern="yyyy-MM-dd"
          [readonly]="isQuoteLocked"
          [(ngModel)]="quote.quote_date"
        ></ui5-date-picker>
      </div>

      <div class="flex flex-col">
        <ui5-label for="sprList" show-colon required i18n>SPR List</ui5-label>
        <ui5-combobox
          id="sprList"
          class="w-full"
          placeholder="Select SPR"
          i18n-placeholder
          [value]="requisitionName"
          [readonly]="isQuoteLocked"
          [attr.value-state]="valueStateOptions.requisition"
          (selectionChange)="onRequisitionChange($event)"
        >
          <div slot="valueStateMessage" i18n>SPR is required</div>
          @for (item of requisitions; track $index) {
            <ui5-cb-item [text]="item.custom_id + ' | ' + item.department?.name" [id]="item.id"></ui5-cb-item>
          }
        </ui5-combobox>
      </div>

      <div class="flex flex-col">
        <ui5-label for="supplierList" show-colon required i18n>Supplier</ui5-label>
        <ui5-combobox
          id="supplierList"
          class="w-full"
          placeholder="Select Supplier"
          i18n-placeholder
          [value]="supplierName"
          [readonly]="isQuoteLocked"
          [attr.value-state]="valueStateOptions.supplier"
          (selectionChange)="onSupplierChange($event)"
        >
          <div slot="valueStateMessage" i18n>Supplier is required</div>
          @for (item of suppliers; track $index) {
            <ui5-cb-item [text]="item.name" [id]="item.id"></ui5-cb-item>
          }
        </ui5-combobox>
      </div>

      <div class="flex flex-col">
        <ui5-label for="validUntil" show-colon i18n>Valid Until</ui5-label>
        <ui5-date-picker
          id="validUntil"
          class="w-full"
          format-pattern="yyyy-MM-dd"
          [readonly]="isQuoteLocked"
          [(ngModel)]="quote.valid_until"
        ></ui5-date-picker>
      </div>

      <div class="flex flex-col">
        <ui5-label for="status" show-colon i18n>PO Status</ui5-label>
        <ui5-input id="status" class="w-full" [readonly]="true" [value]="quoteStatusLabel"></ui5-input>
      </div>

      <div class="flex flex-col col-span-2">
        <ui5-label for="note" show-colon i18n>Note</ui5-label>
        <ui5-textarea id="note" class="w-full" placeholder="Type message..." i18n-placeholder [readonly]="isQuoteLocked" [(ngModel)]="quote.note"></ui5-textarea>
      </div>

      <div class="flex flex-col col-span-2">
        <app-ag-grid-table
          [columns]="itemColumns"
          [dataSource]="itemsDataSource"
          [toolbarConfig]="itemsToolbarConfig"
          [displayConfig]="itemsDisplayConfig"
          selectionMode="Single"
          gridId="purchese-quotation-items"
        ></app-ag-grid-table>
      </div>
    </section>
  </ui5-busy-indicator>
  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      [disabled]="loading || loadingItems || isQuoteLocked"
      (click)="saveQuote()"
      text="Save"
    ></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="loading"
      (click)="CloseDialog()"
      [attr.text]="localization.Cancel"
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>

<app-delete-entity
  [IsDelete]="IsDelete"
  (isSuccess)="onDeleteSuccess()"
></app-delete-entity>
