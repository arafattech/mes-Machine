<div class="grid grid-cols-1 lg:grid-cols-2 gap-2 h-[calc(100vh-60px)]">
  <div class="overflow-hidden rounded-lg border border-slate-200">
    <app-ag-grid-table
      #requisitionAgGridRef
      [columns]="requisitionColumns"
      [dataSource]="requisitionDataSource"
      [toolbarConfig]="requisitionToolbarConfig"
      [displayConfig]="sharedDisplayConfig"
      selectionMode="Single"
      gridId="comparative-requisitions"
      [showIllustratedMessage]="true"
      IllustratedName="NoData"
      (processData)="handleRequisitionData($event)"
      (rowClick)="handleRowSelect($event)"
    ></app-ag-grid-table>
  </div>

  <div class="overflow-hidden rounded-lg border border-slate-200">
    <app-ag-grid-table
      #quoteAgGridRef
      [columns]="quoteColumns"
      [dataSource]="quoteDataSource"
      [toolbarConfig]="quoteToolbarConfig"
      [displayConfig]="sharedDisplayConfig"
      selectionMode="Single"
      gridId="comparative-quotes"
      [showIllustratedMessage]="true"
      IllustratedName="NoData"
    ></app-ag-grid-table>
  </div>
</div>

<ui5-dialog
  [open]="quoteDetailsOpen"
  class="w-[70vw] h-[86vh]"
  [attr.header-text]="selectedQuote ? selectedQuote.custom_id : 'RFQ Details'"
  (before-close)="closeQuoteDetails()"
>
  <ui5-busy-indicator class="w-full h-[72vh]" [delay]="0" [active]="false">
    <section *ngIf="quoteDraft as quote" class="w-[70vw] grid grid-cols-2 gap-3">
      <div class="flex flex-col">
        <ui5-label for="rfqNo" show-colon i18n>RFQ No</ui5-label>
        <ui5-input id="rfqNo" class="w-full" [readonly]="true" [(ngModel)]="quote.custom_id"></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label for="sprNo" show-colon i18n>SPR No</ui5-label>
        <ui5-input id="sprNo" class="w-full" [readonly]="true" [value]="selectedRequisition?.custom_id || quote.requisition?.custom_id || '-'"></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label for="supplierName" show-colon i18n>Supplier</ui5-label>
        <ui5-input id="supplierName" class="w-full" [readonly]="true" [value]="quote.supplier?.name || '-'"></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label for="quoteDate" show-colon i18n>Quote Date</ui5-label>
        <ui5-date-picker
          id="quoteDate"
          class="w-full"
          format-pattern="yyyy-MM-dd"
          [readonly]="true"
          [(ngModel)]="quote.quote_date"
        ></ui5-date-picker>
      </div>

      <div class="flex flex-col">
        <ui5-label for="validUntil" show-colon i18n>Valid Until</ui5-label>
        <ui5-date-picker
          id="validUntil"
          class="w-full"
          format-pattern="yyyy-MM-dd"
          [readonly]="true"
          [(ngModel)]="quote.valid_until"
        ></ui5-date-picker>
      </div>

      <div class="flex flex-col">
        <ui5-label for="quoteStatus" show-colon i18n>Status</ui5-label>
        <ui5-input id="quoteStatus" class="w-full" [readonly]="true" [value]="quote.status || '-'"></ui5-input>
      </div>

      <div class="flex flex-col col-span-2">
        <ui5-label for="note" show-colon i18n>Note</ui5-label>
        <ui5-textarea
          id="note"
          class="w-full"
          [rows]="3"
          [readonly]="true"
          [(ngModel)]="quote.note"
        ></ui5-textarea>
      </div>

      <div class="flex flex-col col-span-2 h-[calc(100vh-500px)] rounded-lg border border-slate-300 pt-4">
        <app-ag-grid-table
          class="h-[calc(100vh-550px)]"
          [columns]="quoteItemColumns"
          [dataSource]="quoteItemDataSource"
          [toolbarConfig]="quoteItemToolbarConfig"
          [displayConfig]="quoteItemDisplayConfig"
          selectionMode="Single"
          gridId="comparative-quote-items"
          [showIllustratedMessage]="true"
          IllustratedName="NoEntries"
          [enableRowClick]="false"
        ></app-ag-grid-table>
      </div>
    </section>
  </ui5-busy-indicator>

  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Transparent"
      (click)="closeQuoteDetails()"
      text="Close"
      i18n-text
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>

<ui5-dialog
  [open]="createPoConfirmOpen"
  class="w-[70vw] h-[86vh]"
  [attr.header-text]="'Create Purchase Order'"
  (before-close)="closeCreatePoConfirm()"
>
  <ui5-busy-indicator class="w-full h-[72vh]" [delay]="0" [active]="awarding || loadingPoItems">
    <section *ngIf="pendingCreateQuote" class="w-[70vw] grid grid-cols-2 gap-3">
      <div class="flex flex-col">
        <ui5-label show-colon i18n>RFQ No</ui5-label>
        <ui5-input class="w-full" [readonly]="true" [value]="pendingCreateQuote.custom_id"></ui5-input>
      </div>
      <div class="flex flex-col">
        <ui5-label show-colon i18n>SPR No</ui5-label>
        <ui5-input class="w-full" [readonly]="true" [value]="selectedRequisition?.custom_id ?? pendingCreateQuote.requisition?.custom_id ?? ''"></ui5-input>
      </div>
      <div class="flex flex-col">
        <ui5-label show-colon i18n>Supplier</ui5-label>
        <ui5-input class="w-full" [readonly]="true" [value]="pendingCreateQuote.supplier?.name ?? ''"></ui5-input>
      </div>
      <div class="flex flex-col">
        <ui5-label show-colon i18n>Total Amount</ui5-label>
        <ui5-input class="w-full" [readonly]="true" [value]="pendingCreateQuote.total_amount ?? 0"></ui5-input>
      </div>
      <div class="col-span-2 rounded-lg border border-slate-300 overflow-hidden">
        <app-ag-grid-table
          [columns]="createPoItemColumns"
          [dataSource]="createPoItemDataSource"
          [toolbarConfig]="createPoItemToolbarConfig"
          [displayConfig]="createPoItemDisplayConfig"
          gridId="create-po-items"
          selectionMode="Single"
          [showIllustratedMessage]="true"
          IllustratedName="NoEntries"
          [isBase]="true"
          [enableRowClick]="false"
        ></app-ag-grid-table>
      </div>
    </section>
  </ui5-busy-indicator>
  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      [disabled]="awarding || loadingPoItems"
      (click)="proceedCreatePurchaseOrder()"
      text="Confirm Create PO"
      i18n-text
    ></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="awarding"
      (click)="closeCreatePoConfirm()"
      text="Cancel"
      i18n-text
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
