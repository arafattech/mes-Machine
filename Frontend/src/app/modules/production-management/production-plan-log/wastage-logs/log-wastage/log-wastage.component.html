<ui5-dialog
  [open]="open"
  class="w-[70vw]"
  header-text="Log Wastage"
  i18n-header-text
  (before-close)="closeDialog()"
>
  <ui5-busy-indicator class="w-full h-[calc(94vh-220px)] overflow-hidden" size="M" [delay]="0" [active]="loading">
    <section class="w-full grid grid-cols-2 gap-3 h-full overflow-hidden">
      <div class="col-span-2 h-full">
        <div class="grid grid-cols-2 gap-3 py-3">
          <div class="flex flex-col col-span-2">
            <ui5-label for="workOrder" show-colon required i18n>Production Order</ui5-label>
            <ui5-combobox
              id="workOrder"
              class="w-full"
              placeholder="Select Production Order"
              i18n-placeholder
              (selectionChange)="onWorkOrderChange($event)"
            >
              <ui5-cb-item
                *ngFor="let wo of workOrders"
                [text]="(wo.customId || 'WO-' + wo.id) + ' · ' + (wo.productName ?? '')"
                [id]="wo.id"
                [value]="wo.id"
              ></ui5-cb-item>
            </ui5-combobox>
          </div>

          <div class="flex flex-col">
            <ui5-label for="shift" show-colon i18n>Shift</ui5-label>
            <ui5-combobox
              id="shift"
              class="w-full"
              placeholder="Current shift (today) — select for past dates"
              i18n-placeholder
              (selectionChange)="onShiftChange($event)"
            >
              <ui5-cb-item
                *ngFor="let shift of shifts"
                [text]="shift.name"
                [id]="shift.id"
                [value]="shift.id"
              ></ui5-cb-item>
            </ui5-combobox>
          </div>

          <div class="flex flex-col">
            <ui5-label for="date" show-colon required i18n>Date</ui5-label>
            <ui5-date-picker
              id="date"
              class="w-full"
              [(ngModel)]="date"
              format-pattern="dd/MM/yyyy"
              placeholder="DD/MM/YYYY"
              i18n-placeholder
            ></ui5-date-picker>
          </div>
        </div>

        <app-ag-grid-table
          #entryGridRef
          [columns]="entryColumns"
          [toolbarConfig]="entryToolbarConfig"
          [dataSource]="entryDataSource"
          [displayConfig]="entryDisplayConfig"
          gridId="wastage-log-entry"
          selectionMode="Single"
          [isBase]="true"
          [showIllustratedMessage]="false"
          IllustratedName="NoEntries"
          noRowsMessage="No wastage types are assigned to machines for this production order"
          i18n-noRowsMessage
        ></app-ag-grid-table>
      </div>
    </section>
  </ui5-busy-indicator>

  <ui5-toolbar slot="footer">
    @if (workOrderId) {
      <ui5-toolbar-button
        design="Emphasized"
        [disabled]="submitting"
        (click)="submit()"
        text="Submit"
        i18n-text
      ></ui5-toolbar-button>
    }
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="loading || submitting"
      (click)="closeDialog()"
      text="Close"
      i18n-text
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>

<ui5-dialog
  [open]="thresholdOpen"
  class="w-[min(90vw,32rem)]"
  header-text="Wastage above limit"
  i18n-header-text
  state="Critical"
  (before-close)="cancelOverThreshold()"
>
  <div class="flex flex-col gap-3 p-2">
    <ui5-text>{{ thresholdMessage }}</ui5-text>
    <div class="flex flex-col">
      <ui5-label for="justification" show-colon required i18n>Justification</ui5-label>
      <ui5-textarea
        id="justification"
        class="w-full"
        [rows]="3"
        [maxlength]="500"
        [(ngModel)]="justification"
        [attr.value-state]="justificationMissing ? 'Negative' : 'None'"
        placeholder="Why is this wastage expected?"
        i18n-placeholder
      >
        <div slot="valueStateMessage" i18n>A justification is required.</div>
      </ui5-textarea>
    </div>
  </div>
  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      [disabled]="submitting"
      (click)="confirmOverThreshold()"
      text="Confirm and log"
      i18n-text
    ></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      (click)="cancelOverThreshold()"
      text="Cancel"
      i18n-text
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
