<div class="flex flex-col h-full w-full">
  <div class="flex flex-wrap items-center justify-between gap-2 mb-1 shrink-0">
    <h2 class="text-base font-semibold panel-title">{{ title }}</h2>
  </div>

  <div *ngIf="isEmpty" class="divergent-bar-empty">

  <div #chartdiv [hidden]="isEmpty" class="divergent-bar-chart"></div>
</div>
