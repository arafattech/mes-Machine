<ui5-button design="Transparent" (click)="openDialog()" i18n>Log Production</ui5-button>

<ui5-dialog
  class="w-[90vw] max-w-xl"
  [open]="open"
  header-text="Log Production"
  i18n-header-text
  (before-close)="closeDialog()"
>
  <ui5-busy-indicator [delay]="0" [active]="loading" size="M" class="w-full">
    <section class="w-full p-2 space-y-4">
      <div>
        <ui5-label show-colon required i18n>Production Order</ui5-label>
        <ui5-combobox
          class="w-100"
          placeholder="Select Production Order"
          i18n-placeholder
          (selectionChange)="onWorkOrderChange($event)"
        >
          <ui5-cb-item
            *ngFor="let wo of workOrders"
            [text]="(wo.customId || 'WO-' + wo.id) + ' · ' + (wo.productName ?? '')"
            [id]="wo.id"
            [value]="wo.id"
          ></ui5-cb-item>
        </ui5-combobox>
        <p *ngIf="!workOrders.length" class="text-xs text-[var(--sapContent_LabelColor,#556b82)] mt-1" i18n>
          No open production orders assigned to this machine.
        </p>
      </div>

      <div>
        <ui5-label show-colon required i18n>Shift</ui5-label>
        <ui5-combobox
          class="w-100"
          placeholder="Select Shift"
          i18n-placeholder
          (selectionChange)="onShiftChange($event)"
        >
          <ui5-cb-item
            *ngFor="let shift of shifts"
            [text]="shift.name"
            [id]="shift.id"
            [value]="shift.id"
          ></ui5-cb-item>
        </ui5-combobox>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <ui5-label show-colon required i18n>Good Count</ui5-label>
          <ui5-input
            class="w-100"
            type="Number"
            (input)="onGoodCountChange($event)"
            placeholder="0"
          ></ui5-input>
        </div>
        <div>
          <ui5-label show-colon required i18n>Scrap Count</ui5-label>
          <ui5-input
            class="w-100"
            type="Number"
            (input)="onScrapCountChange($event)"
            placeholder="0"
          ></ui5-input>
        </div>
      </div>
    </section>
  </ui5-busy-indicator>
  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      [disabled]="loading || !isValid"
      (click)="submit()"
      text="Submit"
      i18n-text
    ></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="loading"
      (click)="closeDialog()"
      text="Cancel"
      i18n-text
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
