<!-- Shared icon, reused across variants -->
<ng-template #iconTpl>
  <ng-container [ngSwitch]="metric.icon">
    <!-- box -->
    <svg
      *ngSwitchCase="'box'"
      xmlns="http://www.w3.org/2000/svg"
      class="h-full w-full"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.8"
        d="M3 7.5 12 3l9 4.5M3 7.5v9L12 21m0-13.5v13.5m9-13.5v9L12 21"
      />
    </svg>

    <!-- cog -->
    <svg
      *ngSwitchCase="'cog'"
      xmlns="http://www.w3.org/2000/svg"
      class="h-full w-full"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.8"
        d="M10.325 4.317a1.724 1.724 0 013.35 0l.234 1.053a1.73 1.73 0 001.07 1.267l.992.41a1.72 1.72 0 010 3.214l-.992.41a1.73 1.73 0 00-1.07 1.266l-.234 1.053a1.724 1.724 0 01-3.35 0l-.234-1.053a1.73 1.73 0 00-1.07-1.266l-.992-.41a1.72 1.72 0 010-3.214l.992-.41c.49-.202.86-.633 1.07-1.267l.234-1.053z"
      />
      <circle cx="12" cy="12" r="2.25" stroke-width="1.8" />
    </svg>

    <!-- sparkles -->
    <svg
      *ngSwitchCase="'sparkles'"
      xmlns="http://www.w3.org/2000/svg"
      class="h-full w-full"
      fill="currentColor"
      viewBox="0 0 20 20"
    >
      <path
        d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l.764 2.35a1 1 0 00.95.69h2.47c.969 0 1.371 1.24.588 1.81l-1.999 1.453a1 1 0 00-.364 1.118l.764 2.35c.3.921-.755 1.688-1.538 1.118l-1.999-1.453a1 1 0 00-1.176 0L7.413 13.816c-.783.57-1.838-.197-1.538-1.118l.764-2.35a1 1 0 00-.364-1.118L4.277 7.777c-.783-.57-.38-1.81.588-1.81h2.47a1 1 0 00.95-.69l.764-2.35z"
      />
    </svg>

    <!-- wrench -->
    <svg
      *ngSwitchCase="'wrench'"
      xmlns="http://www.w3.org/2000/svg"
      class="h-full w-full"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.8"
        d="M21 13a4.5 4.5 0 01-6.364 0L7.05 20.586a2 2 0 11-2.828-2.828L11.81 9.343A4.5 4.5 0 1121 13z"
      />
    </svg>

    <!-- default -->
    <div *ngSwitchDefault class="text-xs font-medium">?</div>
  </ng-container>
</ng-template>

<!-- Hero: large featured OEE composite tile -->
<div
  *ngIf="variant === 'hero'; else standardTpl"
  class="tile-hero relative overflow-hidden rounded-2xl p-5"
>
  <div
    class="absolute inset-y-0 left-0 w-1"
    [style.background]="palette(metric.color).color"
  ></div>
  <div class="flex items-center justify-between gap-4 pl-2">
    <div class="min-w-0">
      <div
        class="text-xs uppercase tracking-wide font-semibold mb-1 truncate"
        [style.color]="palette(metric.color).color"
      >
        {{ metric.label }}
      </div>
      <div class="flex items-baseline gap-2">
        <div class="text-4xl font-bold tile-value">
          {{ formatValue(metric.value, metric.unit ?? "%") }}
        </div>
        <div
          *ngIf="metric.delta !== undefined"
          class="text-xs font-medium"
          [style.color]="deltaInfo.color"
        >
          {{ deltaInfo.arrow }} {{ deltaInfo.abs }}{{ metric.unit ?? "%" }}
        </div>
      </div>
    </div>
    <div
      class="h-16 w-16 shrink-0 rounded-full flex items-center justify-center p-4"
      [style.background]="palette(metric.color).tint"
      [style.color]="palette(metric.color).color"
    >
      <ng-container *ngTemplateOutlet="iconTpl"></ng-container>
    </div>
  </div>
</div>

<!-- Default / compact contributing-factor tile -->
<ng-template #standardTpl>
  <div class="tile-standard rounded-2xl hover:shadow-md transition-shadow" [ngClass]="sizeClasses.tile">
    <div class="flex items-center gap-3">
      <div
        class="shrink-0 rounded-full flex items-center justify-center"
        [ngClass]="sizeClasses.icon"
        [style.background]="palette(metric.color).tint"
        [style.color]="palette(metric.color).color"
      >
        <ng-container *ngTemplateOutlet="iconTpl"></ng-container>
      </div>

      <div class="min-w-0">
        <div class="tile-label leading-tight break-words" [ngClass]="sizeClasses.label">
          {{ metric.label }}
        </div>
        <div class="flex items-baseline gap-2">
          <div class="tile-value font-semibold" [ngClass]="sizeClasses.value">
            {{ formatValue(metric.value, metric.unit ?? "%") }}
          </div>

          <div
            *ngIf="metric.delta !== undefined"
            class="text-xs font-medium"
            [style.color]="deltaInfo.color"
          >
            {{ deltaInfo.arrow }} {{ deltaInfo.abs }}{{ metric.unit ?? "%" }}
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
