<ui5-dialog
  class="w-[90vw] max-w-2xl"
  [open]="open"
  [attr.header-text]="
    this.saveMode === 'POST' ? localization.New : localization.Edit
  "
  (before-close)="CloseDialog()"
>
  <ui5-busy-indicator [delay]="0" [active]="loading" size="M" class="w-full">
    <section class="w-full p-2 space-y-4">
      <div>
        <ui5-label i18n>Verification Buffer</ui5-label>
        <div>
          <ui5-switch [checked]="bufferEnabled" (change)="onBufferEnabledChange($event)"></ui5-switch>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <ui5-label show-colon required i18n>Machine</ui5-label>
          <ui5-select
            class="w-100"
            (change)="onMachineChange($event)"
            [attr.value-state]="valueStateOptions.machine"
          >
            <ui5-option value="null" [selected]="!machineId" disabled i18n>Select Machine</ui5-option>
            <ui5-option *ngFor="let m of machines" [attr.value]="m.id" [selected]="machineId === m.id"
              >{{ m.text }}</ui5-option
            >
            <div slot="valueStateMessage">
              {{ localization.requiredField }}
            </div>
          </ui5-select>
        </div>

        <div>
          <ui5-label show-colon required i18n>Scheduled Date</ui5-label>
          <ui5-date-picker
            class="w-100"
            format-pattern="yyyy-MM-dd"
            [value]="startDate"
            (change)="onDateChange($event)"
            placeholder="Select date"
            i18n-placeholder
            [attr.value-state]="valueStateOptions.startDate"
          >
            <div slot="valueStateMessage">
              {{ localization.requiredField }}
            </div>
          </ui5-date-picker>
        </div>

        <div>
          <ui5-label show-colon required i18n>Scheduled Time</ui5-label>
          <ui5-time-picker
            class="w-100"
            format-pattern="hh:mm a"
            [value]="scheduledTime"
            (change)="onTimeChange($event)"
            placeholder="Select time"
            i18n-placeholder
            [attr.value-state]="valueStateOptions.scheduledTime"
          >
            <div slot="valueStateMessage">
              {{ localization.requiredField }}
            </div>
          </ui5-time-picker>
        </div>
      </div>

      <div>
        <ui5-label show-colon required i18n>Reason</ui5-label>
        <ui5-textarea
          class="w-100"
          [value]="reason"
          (input)="onReasonInput($event)"
          placeholder="Why is this maintenance needed?"
          i18n-placeholder
          [maxlength]="500"
          growing
          [attr.value-state]="valueStateOptions.reason"
        >
          <div slot="valueStateMessage">
            {{ localization.requiredField }}
          </div>
        </ui5-textarea>
      </div>
    </section>
  </ui5-busy-indicator>
  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      (click)="save()"
      [disabled]="loading"
      text="{{ localization.Submit }}"
    ></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="loading"
      (click)="CloseDialog()"
      text="{{ localization.Cancel }}"
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
