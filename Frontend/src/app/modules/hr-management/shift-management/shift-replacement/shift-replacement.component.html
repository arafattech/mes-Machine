<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    [columns]="columns"
    [isBase]="true"
    gridId="hr-shift-replacement"
    [showAction]="false"
    selectionMode="Single"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Shift Replacements Found"
    i18n-IllustratedTitle
  ></app-ag-grid-table>
</div>

<app-replacement-form
  #shiftreplacementform
  (RefreshTable)="processData($event)"
></app-replacement-form>
