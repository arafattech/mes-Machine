<ui5-dialog
  class
  [open]="open"
  [attr.header-text]="
    saveMode === 'POST' ? localization.New : localization.Edit
  "
  (before-close)="closeDialog()">
  <ui5-message-strip class="block max-w-full box-border break-words mb-2" *ngIf="isSameEmployee" (ui5Close)="isSameEmployee = false"
    design="Critical" i18n>Same employee cannot be absent and replacement!</ui5-message-strip>
  <ui5-busy-indicator class="w-full" [delay]="0" [active]="loading" size="M">
    <section class="w-full grid gap-3">
      <div class="grid grid-cols-2 gap-3">

        <div>
          <ui5-label show-colon required i18n>Override Date</ui5-label>
          <ui5-date-picker
            placeholder="Select date"
            class="w-full"
            [value]="shiftOverride.date || ''"
            (change)="onDateChange($event)"
            [attr.value-state]="valueStateOptions.date">
            <div slot="valueStateMessage">{{ validationMessage }}</div>
          </ui5-date-picker>
        </div>

        <div>
          <ui5-label show-colon required i18n>Type</ui5-label>
          <ui5-combobox
            class="w-full"
            placeholder="Select type"
            [value]="shiftOverride.type || ''"
            (selection-change)="onTypeChange($event)"
            [attr.value-state]="valueStateOptions.type">
            <ui5-cb-item
              *ngFor="let type of typeList"
              [text]="type"
              [id]="type"></ui5-cb-item>
            <div slot="valueStateMessage">{{ validationMessage }}</div>
          </ui5-combobox>
        </div>

        <div>

          <ui5-label show-colon required i18n>Select Shift</ui5-label>
          <ui5-combobox
            #shiftCombo
            placeholder="Select a shift"
            class="w-full"
            [value]="selectedShiftName"
            (selection-change)="onShiftChange($event)"
            [attr.value-state]="valueStateOptions.shift">
            <ui5-cb-item
              *ngFor="let shift of shiftList"
              [text]="shift.name"
              [id]="shift.id"></ui5-cb-item>
            <div slot="valueStateMessage">{{ validationMessage }}</div>
          </ui5-combobox>
        </div>
        <div>
          <ui5-label show-colon required i18n>Select Employee</ui5-label>
          <ui5-combobox
            #absentEmployeeCombo
            [placeholder]="'select employee'"
            class="w-full"
            [value]="selectedAbsentEmployeeName"
            (selection-change)="onAbsentEmployeeChange($event)"
            (input)="checkValidation($event, 'absent_employee')"
            [attr.value-state]="valueStateOptions.absent_employee">
            <ui5-cb-item
              *ngFor="let emp of employeeList"
              [text]="emp.employee_no + ' - ' + emp.first_name + ' ' + emp.last_name"
              [id]="emp.id"></ui5-cb-item>
            <div slot="valueStateMessage">{{ validationMessage }}</div>
          </ui5-combobox>
        </div>

        <div *ngIf="shiftOverride.type !== 'EXTRA'">
          <ui5-label show-colon required>{{ replacementEmployeeLabel
            }}</ui5-label>
          <ui5-combobox
            #replacementEmployeeCombo
            [placeholder]="replacementEmployeePlaceholder"
            class="w-full"
            [value]="selectedReplacementEmployeeName"
            (selection-change)="onReplacementEmployeeChange($event)"
            (change)="checkValidation($event, 'replacement_employee')"
            [attr.value-state]="valueStateOptions.replacement_employee">
            <ui5-cb-item
              *ngFor="let emp of employeeList"
              [text]="emp.employee_no + ' - ' + emp.first_name + ' ' + emp.last_name"
              [id]="emp.id"></ui5-cb-item>
            <div slot="valueStateMessage">{{ validationMessage }}</div>
          </ui5-combobox>
        </div>
      </div>
    </section>
  </ui5-busy-indicator>
  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      [disabled]="loading"
      (click)="saveShiftOverride()"
      text="Submit"></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="loading"
      (click)="closeDialog()"
      text="Cancel"></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
