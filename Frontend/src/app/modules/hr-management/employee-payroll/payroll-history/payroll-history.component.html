<div
  class="relative grid gap-2"
  [ngClass]="{
    'grid-cols-1': isListCollapsed || isTabCollapsed,
    'grid-cols-2': !isListCollapsed && !isTabCollapsed,
  }"
>
  <div class="h-[calc(100vh-55px)]" [class.hidden]="isListCollapsed">
    <app-ag-grid-table
      #historyTable
      [dataSource]="historyDataSource"
      [toolbarConfig]="historyToolbarConfig"
      [displayConfig]="historyDisplayConfig"
      [columns]="historyTablecol"
      [showAction]="false"
      [isBase]="true"
      selectionMode="Single"
      gridId="hr-payroll-history-list"
      (rowClick)="selectedRowData($event)"
      (processData)="processData($event)"
    >
    </app-ag-grid-table>
    <div
      class="flex flex-col absolute top-1/2 -translate-x-1/2 -translate-y-1/2 z-50"
      [ngClass]="{
        'left-[99%]': isTabCollapsed,
        'left-[50%]': !isTabCollapsed,
      }"
    >
      <ui5-avatar
        class="relative top-[-40px] border border-slate-400 bg-white"
        [icon]="
          isTabCollapsed ? 'navigation-left-arrow' : 'navigation-right-arrow'
        "
        interactive
        size="XS"
        color-scheme="Placeholder"
        (click)="onCLickTabCollapsed()"
      >
      </ui5-avatar>
    </div>
  </div>
  <div class="h-[calc(100vh-55px)]" [class.hidden]="isTabCollapsed === true">
    <div
      class="flex flex-col absolute top-1/2 -translate-x-1/2 -translate-y-1/2 z-50"
      [ngClass]="{
        'left-[1%]': isListCollapsed,
        'left-[50%]': !isListCollapsed,
        'top-[45%]': isListCollapsed,
      }"
    >
      <ui5-avatar
        class="border border-slate-400 bg-white"
        [icon]="
          isListCollapsed ? 'navigation-right-arrow' : 'navigation-left-arrow'
        "
        interactive
        size="XS"
        color-scheme="Placeholder"
        (click)="onCLickListCollapsed()"
      >
      </ui5-avatar>
    </div>
    <app-ag-grid-table
      #payrollTable
      [dataSource]="payrollDataSource"
      [toolbarConfig]="payrollToolbarConfig"
      [displayConfig]="payrollDisplayConfig"
      [filterQuery]="payrollFilterQuery"
      [columns]="payrollTablecol"
      [showAction]="false"
      [isBase]="true"
      selectionMode="Single"
      gridId="hr-payroll-history-detail"
    >
    </app-ag-grid-table>
  </div>
</div>
