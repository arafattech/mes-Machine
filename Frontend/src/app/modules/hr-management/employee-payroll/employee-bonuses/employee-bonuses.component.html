<div class="flex h-[calc(100vh-50px)]" [style.gap]="payMode ? '3px' : '0'">
  <div
    class="overflow-hidden flex-shrink-0 transition-all duration-200 ease-out will-change-transform"
    [ngClass]="payMode
      ? 'opacity-100 translate-x-0 pointer-events-auto'
      : 'opacity-0 -translate-x-2 pointer-events-none'"
    [style.width]="payMode ? '40%' : '0'"
  >
    <div class="h-full" style="min-width: 260px;">
      <app-ag-grid-table
        #agGridPayModeEmployeeRef
        [columns]="payModeEmployeeColumns"
        [dataSource]="payModeEmployeeDataSource"
        [toolbarConfig]="payModeEmployeeToolbarConfig"
        [gridId]="'hr-bonuses-pay-employees'"
        [selectionMode]="'Single'"
        [selectionRowBehavior]="'RowOnly'"
        [showAction]="false"
        (rowClick)="onPayEmployeeSelect($event)"
        (dataLoaded)="onPayModeEmployeeDataLoaded($event)"
      ></app-ag-grid-table>
    </div>
  </div>

  <div class="flex-1 overflow-hidden">
    <app-ag-grid-table
      #agGridBonusesRef
      [columns]="bonusesColumns"
      [dataSource]="bonusesDataSource"
      [toolbarConfig]="bonusesToolbarConfig"
      [gridId]="'hr-employee-bonuses'"
      [selectionMode]="'Multiple'"
      [selectionRowBehavior]="'Row'"
      [showAction]="true"
      [showEditButton]="false"
      [showDeleteButton]="false"
      [showInfoButton]="true"
      [showDateRangePicker]="true"
      [dateRangePickerValue]="dateRangeValue"
      [dateRangePickerPlaceholder]="'Select date range'"
      [showSwitch]="true"
      [switchLabel]="'Pay'"
      [selectedSwitchValue]="payMode"
      [toolbarFilters]="bonusTypeToolbarFilters"
      (onSwitchChange)="onMainSwitchChange($event)"
      (changeRangeDatePicker)="onDateRangeChange($event)"
      (toolbarAction)="onToolbarAction($event)"
      (extraButtonClick)="openMarkPaidDialog()"
      (downloadButtonClick)="exportEmployeeBonuses($event)"
      (infoClick)="viewEmployeeBonus($event)"
      (selectionChanged)="onPayModeRowSelect($event)"
    ></app-ag-grid-table>
  </div>
</div>

<excel-upload-download
  [exportApiUrl]="'employee-bonuses/export'"
  [exportPayload]="getExportPayload()"
  [exportFileName]="getExportFileName()"
  [IsExportXls]="IsExportXls"
></excel-upload-download>

<ui5-dialog
  class="w-[min(780px,calc(100vw-2rem))] [&::part(content)]:!p-0"
  [open]="isMarkPaidDialogOpen"
  header-text="Confirm Payment"
  i18n-header-text
>
  <div class="w-full flex flex-col" style="height: 420px;">
    <div class="flex-1 overflow-hidden">
      <app-ag-grid-table
        #agGridConfirmPayRef
        [columns]="confirmPayColumns"
        [dataSource]="confirmPayDataSource"
        [toolbarConfig]="confirmPayToolbarConfig"
        [isBusy]="isConfirmPayLoading"
        [selectionMode]="'None'"
        [showAction]="false"
        [gridId]="'hr-bonuses-confirm-pay'"
      ></app-ag-grid-table>
    </div>

    <div class="flex items-center justify-between border-t border-blue-200 bg-blue-50 px-5 py-2">
      <span class="text-lg font-bold text-blue-700" i18n>Total:</span>
      <span class="text-lg font-bold text-blue-700">{{ markPaidTotal | number:'1.2-2' }}</span>
    </div>
  </div>

  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      (click)="confirmMarkPaid()"
      i18n-text
      text="Confirm"
    ></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      (click)="closeMarkPaidDialog()"
      i18n-text
      text="Cancel"
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>

<ui5-dialog
  [open]="isDialogOpen"
  header-text="Employee Bonus Details"
  i18n-header-text
  class="w-[min(760px,calc(100vw-2rem))] [&::part(content)]:!px-6 [&::part(content)]:!py-4"
  (before-close)="CloseDialog()"
>
  <section class="w-full">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-3">
      <div class="flex flex-col">
        <ui5-label show-colon i18n>Employee</ui5-label>
        <ui5-input class="w-full" [value]="getEmployeeName(employeeBonus.employee) || '--'" readonly></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label show-colon i18n>Employee No</ui5-label>
        <ui5-input class="w-full" [value]="formatDisplayValue(employeeBonus.employee?.employee_no || employeeBonus.emp_id)" readonly></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label show-colon i18n>Bonus Type</ui5-label>
        <ui5-input class="w-full" [value]="formatBonusType(employeeBonus) || '--'" readonly></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label show-colon i18n>Bonus Amount</ui5-label>
        <ui5-input class="w-full" type="Number" [value]="formatDisplayValue(employeeBonus.amount)" readonly></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label show-colon i18n>Is Paid</ui5-label>
        <ui5-switch [checked]="isEmployeeBonusPaid(employeeBonus)" disabled></ui5-switch>
      </div>

      <div class="flex flex-col">
        <ui5-label show-colon i18n>Status</ui5-label>
        <ui5-input class="w-full" [value]="formatBonusStatus(employeeBonus)" readonly></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label show-colon i18n>Attendance Date</ui5-label>
        <ui5-input class="w-full" [value]="(employeeBonus.attendance_date | date:'dd/MM/yyyy') || '--'" readonly></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label show-colon i18n>Shift</ui5-label>
        <ui5-input class="w-full" [value]="employeeBonus.shift?.name || '--'" readonly></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label show-colon i18n>Attendance Log</ui5-label>
        <ui5-input
          class="w-full"
          [value]="formatDisplayValue(employeeBonus.attendanceLog?.custom_id || employeeBonus.attendance_log_id)"
          readonly
        ></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label show-colon i18n>Overtime Minutes</ui5-label>
        <ui5-input class="w-full" [value]="formatDisplayValue(employeeBonus.overtime_minutes)" readonly></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label show-colon i18n>Calculation Type</ui5-label>
        <ui5-input class="w-full" [value]="employeeBonus.calculation_type || '--'" readonly></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label show-colon i18n>Source Type</ui5-label>
        <ui5-input class="w-full" [value]="employeeBonus.source_type || '--'" readonly></ui5-input>
      </div>

      <div class="flex flex-col">
        <ui5-label show-colon i18n>Created On</ui5-label>
        <ui5-input class="w-full" [value]="(employeeBonus.created_at | date:'dd/MM/yyyy') || '--'" readonly></ui5-input>
      </div>

      <div class="flex flex-col md:col-span-2">
        <ui5-label show-colon i18n>Remarks</ui5-label>
        <ui5-textarea class="w-full h-[80px]" [value]="employeeBonus.remarks || employeeBonus.description || '--'" readonly></ui5-textarea>
      </div>
    </div>
  </section>

  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Transparent"
      (click)="CloseDialog()"
      i18n-text
      text="Close"
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
