<app-ag-grid-table
  #agGridRef
  [dataSource]="dataSource"
  [toolbarConfig]="toolbarConfig"
  [columns]="columns"
  [showAction]="true"
  [isBase]="true"
  [showEditButton]="permission.hasPermission(permissions.HR_BONUS_CONFIG_EDIT)"
  [showDeleteButton]="permission.hasPermission(permissions.HR_BONUS_CONFIG_DELETE)"
  gridId="hr-bonus-config"
  selectionMode="Single"
  [showIllustratedMessage]="true"
  IllustratedName="NoData"
  IllustratedTitle="No Bonus Configs Found"
  i18n-IllustratedTitle
  (newButtonClick)="newBonusConfig()"
  (editClick)="editBonusConfig($event)"
  (deleteClick)="deleteClick($event)"
>
</app-ag-grid-table>

<app-delete-entity
  (isSuccess)="processData()"
  [IsDelete]="IsDelete"
></app-delete-entity>

<ui5-dialog
  class="ui5-xl-without-tab"
  [open]="open"
  [attr.header-text]="
    saveMode === 'POST' ? localization.New : localization.Edit
  "
  (before-close)="closeDialog()"
>
  <ui5-busy-indicator class="w-full" [delay]="0" [active]="loading" size="M">
    <section class="w-full">
      <div class="flex gap-2">
        <div class="flex flex-col">
          <ui5-label show-colon i18n>Active</ui5-label>
          <ui5-switch [(ngModel)]="bonusConfig.is_active"></ui5-switch>
        </div>
      </div>

      <ui5-label show-colon required i18n>Name</ui5-label>
      <ui5-input
        class="w-full"
        [(ngModel)]="bonusConfig.name"
        placeholder="Enter bonus name"
        (input)="checkValidation($event, 'name')"
        [attr.value-state]="valueStateOptions.name"
        i18n-placeholder
      >
        <div slot="valueStateMessage">
          {{ validationMessage }}
        </div>
      </ui5-input>

      <ui5-label show-colon required i18n>Bonus Type</ui5-label>
      <ui5-combobox
        class="w-full"
        placeholder="Select Bonus Type"
        [(ngModel)]="bonusTypeName"
        (selection-change)="onBonusTypeChange($event)"
        [attr.value-state]="valueStateOptions.bonus_type_id"
        i18n-placeholder
      >
        <ui5-cb-item
          *ngFor="let item of bonusTypes"
          [text]="item.name"
          [id]="item.id"
        ></ui5-cb-item>
        <div slot="valueStateMessage">
          {{ validationMessage }}
        </div>
      </ui5-combobox>

      <ui5-label show-colon required i18n>Calculation Type</ui5-label>
      <ui5-combobox
        class="w-full"
        placeholder="Select Calculation Type"
        [(ngModel)]="bonusConfig.calculation_type"
        (change)="
          checkValidation($event, 'calculation_type');
          onCalculationTypeChange($event)
        "
        [attr.value-state]="valueStateOptions.calculation_type"
        i18n-placeholder
      >
        <ui5-cb-item
          *ngFor="let item of calculationTypes"
          [text]="item"
          [value]="item"
        ></ui5-cb-item>

        <div slot="valueStateMessage">
          {{ validationMessage }}
        </div>
      </ui5-combobox>

      <ui5-label show-colon i18n>Amount</ui5-label>
      <ui5-input
        class="w-full"
        type="Number"
        placeholder="Enter amount"
        [(ngModel)]="bonusConfig.amount"
        i18n-placeholder
      ></ui5-input>

      <ui5-label show-colon required i18n>Applicable To</ui5-label>
      <ui5-combobox
        class="w-full"
        placeholder="Select Applicable"
        [(ngModel)]="bonusConfig.applicable_to"
        (change)="
          checkValidation($event, 'applicable_to'); onApplicableChange($event)
        "
        [attr.value-state]="valueStateOptions.applicable_to"
        i18n-placeholder
      >
        <ui5-cb-item
          *ngFor="let item of applicableBonus"
          [text]="item"
          [value]="item"
        ></ui5-cb-item>

        <div slot="valueStateMessage">
          {{ validationMessage }}
        </div>
      </ui5-combobox>

      <ng-container *ngIf="bonusConfig.applicable_to === 'DEPARTMENT'">
        <ui5-label show-colon i18n>Department</ui5-label>
        <ui5-combobox
          class="w-full"
          placeholder="Select department"
          [(ngModel)]="departmentName"
          (selection-change)="onDepartmentChange($event)"
          i18n-placeholder
        >
          <ui5-cb-item
            *ngFor="let dept of departments"
            [text]="dept.name"
            [id]="dept.id"
          ></ui5-cb-item>
        </ui5-combobox>
      </ng-container>

      <ng-container *ngIf="bonusConfig.applicable_to === 'EMPLOYEE'">
        <ui5-label show-colon i18n>Employee</ui5-label>
        <ui5-combobox
          class="w-full"
          placeholder="Select employee"
          [(ngModel)]="employeeName"
          (selection-change)="onEmployeeChange($event)"
          i18n-placeholder
        >
          <ui5-cb-item
            *ngFor="let employee of employees"
            [text]="
              employee.employee_no +
              ' - ' +
              employee.first_name +
              ' ' +
              employee.last_name
            "
            [id]="employee.id"
          ></ui5-cb-item>
        </ui5-combobox>
      </ng-container>
    </section>
  </ui5-busy-indicator>

  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      (click)="saveBonusConfig()"
      [disabled]="loading"
      text="{{ localization.Submit }}"
    ></ui5-toolbar-button>

    <ui5-toolbar-button
      design="Transparent"
      (click)="closeDialog()"
      [disabled]="loading"
      text="{{ localization.Cancel }}"
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
