<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    [columns]="columns"
    [showAction]="true"
    [isBase]="true"
    [showEditButton]="checkPermission('HR_BIOMETRIC_EDIT')"
    [showDeleteButton]="checkPermission('HR_BIOMETRIC_DELETE')"
    selectionMode="Single"
    gridId="hr-biometrics"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Devices Found"
    i18n-IllustratedTitle
    (newButtonClick)="newConfig()"
    (editClick)="editConfig($event)"
    (deleteClick)="deleteConfig($event)"
  ></app-ag-grid-table>
</div>

<ui5-dialog
  [open]="isDialogOpen"
  [attr.header-text]="
    saveMode === 'POST' ? localization.New : localization.Edit
  "
  (before-close)="CloseDialog()"
>
  <div class="flex flex-col">
    <div class="col-md-12">
      <ui5-label show-colon class="w-100">
        {{ localization.Active }}
      </ui5-label>
      <ui5-switch [(ngModel)]="device.is_active"></ui5-switch>
    </div>

    <div>
      <ui5-label show-colon required i18n>Device Name </ui5-label>
      <ui5-input
        class="w-100"
        [(ngModel)]="device.name"
        placeholder="Enter device name"
        i18n-placeholder
        (input)="checkValidation($event, 'name')"
        [attr.value-state]="valueStateOptions.name"
      >
        <div slot="valueStateMessage">{{ validationMessage }}</div>
      </ui5-input>
    </div>

    <div>
      <ui5-label show-colon required i18n>Device IP </ui5-label>
      <ui5-input
        class="w-100"
        [(ngModel)]="device.ip"
        placeholder="192.168.xxx.xxx"
        i18n-placeholder
        (input)="checkValidation($event, 'ip')"
        [attr.value-state]="valueStateOptions.ip"
      >
        <div slot="valueStateMessage">{{ validationMessage }}</div>
      </ui5-input>
    </div>
    <div>
      <ui5-label show-colon required i18n>Device Port</ui5-label>
      <ui5-input
        type="Number"
        class="w-100"
        [(ngModel)]="device.port"
        placeholder="Enter device port"
        i18n-placeholder
      ></ui5-input>
    </div>
    <div>
      <ui5-label show-colon i18n>Timeout</ui5-label>
      <ui5-input
        type="Number"
        class="w-100"
        [(ngModel)]="device.timeout"
        placeholder="Enter timeout"
        i18n-placeholder
      ></ui5-input>
    </div>
    <div>
      <ui5-label show-colon i18n>Inport</ui5-label>
      <ui5-input
        type="Number"
        class="w-100"
        [(ngModel)]="device.inport"
        placeholder="Enter inport"
        i18n-placeholder
      ></ui5-input>
    </div>
  </div>
  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      (click)="saveDevice()"
      [disabled]="isLoading"
      [text]="localization.Submit"
    ></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      (click)="CloseDialog()"
      [disabled]="isLoading"
      [text]="localization.Cancel"
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>

<app-delete-entity [IsDelete]="IsDelete" (isSuccess)="processData($event)">
</app-delete-entity>
