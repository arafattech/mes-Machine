<ui5-busy-indicator class="w-full" [delay]="0" [active]="loading">
  <div class="flex flex-col h-[calc(100vh-110px)] w-full overflow-hidden p-2 gap-3 bg-[var(--sapBackgroundColor,#fff)]">

    <div class="flex items-center gap-2 px-3 py-1.5 rounded-2xl border border-[var(--sapList_BorderColor,#d9d9d9)] shadow-sm shrink-0 bg-[var(--sapGroup_ContentBackground,#fff)]">
      <ui5-title level="H5" class="font-bold shrink-0 tracking-tight" i18n>My Calendar</ui5-title>

      <div class="flex-1"></div>

      <div class="flex items-center gap-0.5">
        <ui5-button icon="slim-arrow-left" design="Transparent" (click)="prevMonth()"></ui5-button>
        <span class="text-sm font-semibold min-w-[130px] text-center select-none tabular-nums text-[var(--sapTextColor,#1d2d3e)]">{{ currentMonthYearLabel }}</span>
        <ui5-button icon="slim-arrow-right" design="Transparent" (click)="nextMonth()"></ui5-button>
      </div>
      <ui5-button design="Transparent" (click)="goToday()" i18n>Today</ui5-button>
    </div>

    <div class="flex flex-col flex-1 min-h-0 rounded-xl border border-[var(--sapList_BorderColor,#d9d9d9)] shadow-sm overflow-hidden bg-[var(--sapGroup_ContentBackground,#fff)]">
      <div class="flex-1 min-h-0 overflow-x-auto overflow-y-auto">
        <full-calendar #fullCalendar [options]="calendarOptions" class="w-full h-full"></full-calendar>
      </div>
      <div class="px-4 py-2.5 border-t border-[var(--sapList_BorderColor,#d9d9d9)] bg-[var(--sapList_HeaderBackground,#f8fafc)] shrink-0">
        <div class="flex flex-wrap gap-2">
          <div *ngFor="let type of legendTypes"
            class="flex items-center gap-1.5 px-2.5 py-1 rounded-md border border-[var(--sapList_BorderColor,#d9d9d9)] bg-[var(--sapGroup_ContentBackground,#fff)] shadow-sm">
            <div class="w-2 h-2 rounded-full shrink-0" [style.background-color]="type.color"></div>
            <span class="text-[10px] font-bold uppercase tracking-tight text-[var(--sapTextColor,#1d2d3e)]">{{ type.name }}</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</ui5-busy-indicator>
