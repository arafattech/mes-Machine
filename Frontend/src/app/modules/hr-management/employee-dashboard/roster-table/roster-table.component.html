<div class="flex space-x-4 w-full" [ngStyle]="theme.currentThemeStyle(false)">
  <div class="w-1/4 border rounded-lg shadow-sm p-4 mt-2">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-semibold text-emerald-700" i18n>Shift Details</h2>
    </div>

    <div *ngIf="shifts.length > 0" class="space-y-3 max-h-[70vh] overflow-y-auto pr-1">
      <div *ngFor="let shift of shifts"
        class="border rounded-lg px-3 py-2 shadow-sm hover:shadow-md transition-all cursor-pointer flex items-center justify-between"
        [style.borderLeft]="'4px solid ' + (shift.color || '#10b981')">
        <div>
          <div class="text-sm font-semibold">{{ shift.name }}</div>
          <div class="text-sm">
            {{ shift.start_time | date : "shortTime" }} -
            {{ shift.end_time | date : "shortTime" }}
          </div>
        </div>
        <div class="w-4 h-4 rounded-full" [style.backgroundColor]="shift.color"></div>
      </div>
    </div>

    <div *ngIf="!loading && shifts.length === 0" class="text-center py-4" i18n>
      No shifts available
    </div>
  </div>
  <div class="flex-1 mt-3 w-full rounded-lg overflow-hidden border  shadow-sm">
    <div class="flex items-center justify-between bg-emerald-700  px-4 py-1 space-x-4">
      <div class="text-lg font-semibold text-white tracking-wide flex-shrink-0" i18n
        [ngStyle]="{color: theme.currentThemeStyle(false).color}">
        Roster Table
      </div>
      <ui5-combobox class="w-40" (selection-change)="onMonthChange($event)" placeholder="Select month"
        [value]="selectedMonth.toString()">
        <ui5-cb-item *ngFor="let month of months; index as i" [value]="i.toString()" [text]="month">
        </ui5-cb-item>
      </ui5-combobox>
      <div class="flex items-center space-x-2 rounded-lg px-2 py-1">
        <ui5-button icon="navigation-left-arrow" design="Transparent"
          class="w-8 h-8 font-extralight text-white hover:text-black" (click)="previousWeek()"></ui5-button>
        <div class="flex space-x-4">
          <div class="flex flex-col items-center text-xs cursor-pointer p-1 rounded-md transition-colors"
            *ngFor="let day of weekDates" [ngClass]="{
              'text-blue-600 bg-blue-100': day.isToday,
              'text-white hover:font-extrabold': !day.isToday
            }">
            <span>{{ day.dayName }}</span>
            <span class="text-base">{{ day.date }}</span>
          </div>
        </div>
        <ui5-button icon="navigation-right-arrow" design="Transparent"
          class="w-8 h-8 font-extrabold text-white hover:text-black" (click)="nextWeek()"></ui5-button>
      </div>
    </div>

    <div class="grid grid-cols-7 border-b">
      <div *ngFor="let day of weekDates" class="flex flex-col items-center justify-center p-3 border-l">
        <div class="text-base font-semibold">
          {{ day.fullDate.format("DD/MM/YYYY") }}
        </div>
        <div class="text-sm  font-medium uppercase">
          {{ day.dayName }}
        </div>
      </div>
    </div>

    <ng-container *ngIf="getMaxShiftRows().length; else noShifts">
      <ng-container *ngFor="let rowIndex of getMaxShiftRows()">
        <div class="grid grid-cols-7 transition-colors">
          <div *ngFor="let day of weekDates"
            class="p-3 text-center border-l border-b border-gray-200 flex items-center justify-center">
            <ng-container *ngIf="getShiftForDay(day, rowIndex) as shift">
              <span [ngStyle]="{ 'background-color': shift.color }"
                class="inline-block text-sm font-semibold rounded-full text-white px-3 py-1 shadow-sm">
                {{ shift.shift_name }}
              </span>
            </ng-container>
          </div>
        </div>
      </ng-container>
    </ng-container>

    <ng-template #noShifts>
      <div class="text-center py-4" i18n>
        No shifts available
      </div>
    </ng-template>

  </div>
</div>
