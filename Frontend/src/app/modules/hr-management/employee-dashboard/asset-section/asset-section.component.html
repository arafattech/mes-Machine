<div class="h-[calc(100vh-200px)]">
  <app-ag-grid-table
    #agGridRef
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    [filterQuery]="'employee_id eq ' + employeeId"
    [columns]="columns"
    [isBase]="true"
    gridId="hr-asset-section"
    [showAction]="false"
    selectionMode="Single"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Assets Found"
    i18n-IllustratedTitle
  ></app-ag-grid-table>
</div>
