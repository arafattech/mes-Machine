<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    [columns]="columns"
    [isBase]="true"
    gridId="hr-holiday-type-management"
    [showAction]="true"
    [showEditButton]="rolePermissionService.hasPermission(permissions.HR_HOLIDAY_TYPE_EDIT)"
    [showDeleteButton]="rolePermissionService.hasPermission(permissions.HR_HOLIDAY_TYPE_DELETE)"
    selectionMode="Single"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Holiday Types Found"
    i18n-IllustratedTitle
    (newButtonClick)="newHolidayType()"
    (editClick)="editHolidayType($event)"
    (deleteClick)="deleteClick($event.id)"
  ></app-ag-grid-table>
</div>

<app-delete-entity [IsDelete]="IsDelete" (isSuccess)="processData()">
</app-delete-entity>

<ui5-dialog
  class="ui5-xl-without-tab"
  [open]="open"
  [attr.header-text]="
    saveMode === 'POST' ? localization.New : localization.Edit
  "
  (before-close)="closeDialog()"
>
  <ui5-busy-indicator class="w-full" [delay]="0" [active]="loading" size="M">
    <section class="w-full">
      <div class="flex gap-2">
        <div class="flex flex-col">
          <ui5-label show-colon>{{ localization.Active }}</ui5-label>
          <ui5-switch checked [(ngModel)]="holidayType.is_active"></ui5-switch>
        </div>
      </div>

      <ui5-label show-colon required i18n>Name</ui5-label>
      <ui5-input
        class="w-100"
        [(ngModel)]="holidayType.name"
        placeholder="Enter holiday type name"
        i18n-placeholder
        (input)="checkValidation($event, 'name')"
        [attr.value-state]="valueStateOptions.name"
        type="Text"
      >
        <div slot="valueStateMessage">
          {{ validationMessage }}
        </div>
      </ui5-input>

      <ui5-label show-colon required i18n>Color</ui5-label>
      <div class="flex items-center gap-2 w-full">
        <div
          class="rounded h-6 flex-[0_0_80%]"
          [style.background-color]="holidayType.color || 'rgb(0, 128, 0)'"
        ></div>
        <ui5-button
          class="flex-[0_0_20%]"
          design="Emphasized"
          (click)="openColorPickerDialog()" i18n>Select
        </ui5-button>
      </div>
      <ui5-dialog
        [open]="colorDialogOpen"
        header-text="Select Color"
        (before-close)="closeColorPickerDialog()"
      >
        <ui5-color-picker
          [value]="holidayType.color || 'rgb(0, 128, 0)'"
          (change)="onColorPickerChange($event)"
        >
        </ui5-color-picker>
        <ui5-toolbar slot="footer">
          <ui5-toolbar-button design="Emphasized" (click)="confirmColor()" text="{{ localization.Confirm }}">
          </ui5-toolbar-button>
          <ui5-toolbar-button design="Transparent" (click)="closeColorPickerDialog()" text="{{ localization.Cancel }}">
          </ui5-toolbar-button>
        </ui5-toolbar>
      </ui5-dialog>

    </section>
  </ui5-busy-indicator>

  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      (click)="saveHolidayType()"
      [disabled]="loading"
      text="{{ localization.Submit }}"
    >
    </ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="loading"
      (click)="closeDialog()"
      text="{{ localization.Cancel }}"
    >
    </ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
