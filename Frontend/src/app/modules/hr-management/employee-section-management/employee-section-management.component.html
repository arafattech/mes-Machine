<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    [columns]="columns"
    [isBase]="true"
    gridId="hr-employee-section"
    [showAction]="true"
    [showEditButton]="permission.hasPermission(permissions.HR_EMPLOYEE_SECTION_EDIT)"
    [showDeleteButton]="permission.hasPermission(permissions.HR_EMPLOYEE_SECTION_DELETE)"
    selectionMode="Single"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Employee Sections Found"
    i18n-IllustratedTitle
    IllustratedSubtitle="Try adjusting your search or active status."
    i18n-IllustratedSubtitle
    (newButtonClick)="newSection()"
    (editClick)="editSection($event)"
    (deleteClick)="deleteClick($event.id)"
  ></app-ag-grid-table>
</div>


<ui5-dialog [open]="isDialogOpen" [attr.header-text]="
    this.saveMode === 'POST' ? localization.New : localization.Edit
  " (before-close)="CloseDialog()">

    <div class="flex flex-col">
      <div class="mb-3 flex gap-4">
        <div class="flex flex-col">
          <ui5-label show-colon>{{ localization.Active }}</ui5-label>
          <ui5-switch checked [(ngModel)]="employeeSection.is_active"></ui5-switch>
        </div>
        <div class="flex flex-col">
          <ui5-label show-colon i18n>Attendance Bonus</ui5-label>
          <ui5-switch [(ngModel)]="employeeSection.is_attendanceBonus"></ui5-switch>
        </div>
        <div class="flex flex-col">
          <ui5-label show-colon i18n>Overtime Bonus</ui5-label>
          <ui5-switch [(ngModel)]="employeeSection.is_overtimeBonus"></ui5-switch>
        </div>
      </div>
      <ui5-label show-colon required i18n>Section Name</ui5-label>
      <ui5-input
        class="w-100"
        [(ngModel)]="employeeSection.name"
        placeholder="Enter employee section name"
        (input)="checkValidation($event , 'name')"
        [attr.value-state]="valueStateOptions.name"
        type="Text"
        i18n-placeholder
      >
        <div slot="valueStateMessage">
          {{ validationMessage }}
        </div>
      </ui5-input>
    </div>

  <ui5-toolbar slot="footer">
    <ui5-toolbar-button design="Emphasized" (click)="saveSection()" [disabled]="isLoading"
      text="{{ localization.Submit }}"></ui5-toolbar-button>
    <ui5-toolbar-button design="Transparent" [disabled]="isLoading" (click)="CloseDialog()"
      text="{{ localization.Cancel }}"></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>

<app-delete-entity [IsDelete]="IsDelete" (isSuccess)="processData($event)">
</app-delete-entity>
