<div class="rounded-2xl p-1 h-full flex flex-col">
  <div class="flex items-center justify-between mb-2">
    <div class="flex items-center gap-2">
      <div class="w-1 h-4 bg-cyan-500 rounded-full"></div>
      <span class="text-[10px] font-bold uppercase opacity-75" i18n>Bonus & Deductions</span>
    </div>
    <button class="hover:opacity-75 transition-opacity">
      <span class="text-xl leading-none opacity-50">⋮</span>
    </button>
  </div>

  <div class="relative flex-1 w-full min-h-[110px] flex items-center justify-center">
    <canvas #canvas class="w-full h-full"></canvas>

    <div *ngIf="showCenterContent" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
      <p class="text-xs opacity-75">{{ centerTitle }}</p>
      <p class="text-xl font-bold">{{ formatMoney(total) }}</p>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-05 mt-0 mb-05">
    <div class="flex items-start gap-2">
      <div class="w-1 h-8 rounded-full"
           [style.backgroundColor]="firstItem?.color || '#06b6d4'"></div>
      <div>
        <p class="text-sm font-bold">
          {{ formatMoney(firstItem?.value || 0) }}
        </p>
        <p class="text-[11px] opacity-75">
          {{ firstItem?.label || 'Bonuses' }}
        </p>
      </div>
    </div>

    <div class="flex items-start gap-2 justify-end">
      <div class="w-1 h-8 rounded-full"
           [style.backgroundColor]="secondItem?.color || '#34d399'"></div>
      <div class="text-right">
        <p class="text-sm font-bold">
          {{ formatMoney(secondItem?.value || 0) }}
        </p>
        <p class="text-[11px] opacity-75">
          {{ secondItem?.label || 'Incentives' }}
        </p>
      </div>
    </div>
  </div>
</div>
