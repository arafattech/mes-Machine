<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [columns]="columns"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    selectionMode="Single"
    [isBase]="true"
    [gridId]="gridId"
    [showAction]="true"
    [showEditButton]="rolePermissionService.hasPermission(permissions.HR_LEAVE_TYPE_EDIT)"
    [showDeleteButton]="rolePermissionService.hasPermission(permissions.HR_LEAVE_TYPE_DELETE)"
    (newButtonClick)="newLeaveType()"
    (editClick)="editLeaveType($event)"
    (deleteClick)="deleteClick($event.id)"
    (rowClick)="editLeaveType($event)"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Leave Types Found"
    IllustratedSubtitle="Try adjusting your search."
  ></app-ag-grid-table>
</div>

<app-leave-type-form
  #leaveTypeForm
  [saveMode]="saveMode"
  [leaveType]="leaveType"
  (RefreshTable)="processData($event)"
></app-leave-type-form>

<app-delete-entity [IsDelete]="IsDelete" (isSuccess)="processData($event)">
</app-delete-entity>
