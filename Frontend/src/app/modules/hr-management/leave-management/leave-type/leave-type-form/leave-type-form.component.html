<ui5-dialog class="ui5-xl-without-tab" [open]="open"
  [attr.header-text]="this.saveMode === 'POST' ? localization.New : localization.Edit" (before-close)="closeDialog()">
  <ui5-busy-indicator class="w-full" [delay]="0" [active]="loading" size="M">
    <section class="w-full">
      <div class="row">
        <div class="col-md-3">
          <ui5-label showColon class="w-100" i18n>Active</ui5-label>
          <ui5-switch checked [(ngModel)]="leaveType.is_active"></ui5-switch>
        </div>
        <div class="col-md-3">
          <ui5-label showColon class="w-100" i18n>Paid</ui5-label>
          <ui5-switch checked [(ngModel)]="leaveType.is_paid"></ui5-switch>
        </div>
        <div class="col-md-6">
          <ui5-label showColon class="w-100" i18n>Document Required</ui5-label>
          <ui5-switch checked [(ngModel)]="leaveType.document_required"></ui5-switch>
        </div>
      </div>

      <ui5-label show-colon required i18n class="mt-2">Leave Type Name</ui5-label>
      <ui5-input
        class="w-100"
        [(ngModel)]="leaveType.name"
        placeholder="Enter leave type name"
        i18n-placeholder
        (input)="checkValidation($event, 'name')"
        [attr.value-state]="valueStateOptions.name"
        type="Text"
      >
        <div slot="valueStateMessage">
          {{ validationMessage }}
        </div>
      </ui5-input>

      <ui5-label show-colon required i18n class="mt-2">Max Days Per Year</ui5-label>
      <ui5-input
        class="w-100"
        [(ngModel)]="leaveType.max_days"
        placeholder="Enter max days"
        i18n-placeholder
        (input)="checkValidation($event, 'max_days')"
        [attr.value-state]="valueStateOptions.max_days"
        type="Number"
      >
        <div slot="valueStateMessage">
          {{ validationMessage }}
        </div>
      </ui5-input>

      <ui5-label show-colon i18n class="mt-2">Approval Type</ui5-label>
      <ui5-combobox
        class="w-100"
        [value]="getApprovalTypeName(leaveType.approval_type_id)"
        placeholder="Select approval type"
        i18n-placeholder
        (selection-change)="onApprovalTypeChange($event)"
      >
        <ui5-cb-item *ngFor="let type of approvalTypes" [text]="type.name" [value]="type.id"></ui5-cb-item>
      </ui5-combobox>
    </section>
  </ui5-busy-indicator>
  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      (click)="save()"
      [disabled]="loading"
      text="{{ localization.Submit }}"
    ></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="loading"
      (click)="closeDialog()"
      text="{{ localization.Cancel }}"
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
