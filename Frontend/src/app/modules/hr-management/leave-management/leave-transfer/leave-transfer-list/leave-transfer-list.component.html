<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    [columns]="columns"
    [isBase]="true"
    gridId="hr-leave-transfer"
    [showAction]="false"
    selectionMode="Single"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Holiday Swap Records Found"
    i18n-IllustratedTitle
    (newButtonClick)="newLeaveTransfer()"
  ></app-ag-grid-table>
</div>


<app-leave-transfer-form
  #leaveTransferForm
  [saveMode]="saveMode"
  (RefreshTable)="processData($event)"
></app-leave-transfer-form>
