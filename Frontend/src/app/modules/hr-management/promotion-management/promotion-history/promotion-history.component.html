<div class="h-[60vh]">
  <app-ag-grid-table
    #historyTableRef
    [columns]="column"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    selectionMode="Single"
    selectionRowBehavior="RowOnly"
    [isBase]="true"
    gridId="hr-promotion-history-list"
    [showAction]="false"
    [showEditButton]="false"
    [showDeleteButton]="false"
    [toolbarFilters]="employeeToolbarFilters"
    [showDateRangePicker]="true"
    [dateRangePickerValue]="dateRangeValue"
    [dateRangePickerPlaceholder]="'Promotion Date Range'"
    (changeRangeDatePicker)="onDateRangeChange($event)"
    (toolbarAction)="onToolbarAction($event)"
    (resetButtonClick)="onResetFilters()"
    (downloadButtonClick)="downloadButtonClick()"
  ></app-ag-grid-table>
</div>

<excel-upload-download
  [exportApiUrl]="'hrm/promotions/export'"
  [exportPayload]="getExportPayload()"
  [exportFileName]="getExportFileName()"
  [IsExportXls]="IsExportXls"
></excel-upload-download>

<ui5-dialog
  class="w-[min(680px,calc(100vw-2rem))] [&::part(content)]:!px-6 [&::part(content)]:!py-4"
  [open]="isDetailsDialogOpen"
  [attr.header-text]="'Promotion Details'"
  (before-close)="closeDetails()"
>
  <div class="w-full space-y-4 py-1">
    <div class="grid grid-cols-2 gap-x-8 gap-y-4 text-sm">
      <div class="flex flex-col gap-1">
        <ui5-label show-colon i18n>Employee</ui5-label>
        <ui5-input class="w-full" [value]="getEmployeeName()" readonly></ui5-input>
      </div>

      <div class="flex flex-col gap-1">
        <ui5-label show-colon i18n>Promotion Type</ui5-label>
        <ui5-input class="w-full" [value]="getPromotionTypeLabel(selectedPromotion?.promotion_type)" readonly></ui5-input>
      </div>

      <div class="flex flex-col gap-1">
        <ui5-label show-colon i18n>Old Designation</ui5-label>
        <ui5-input class="w-full" [value]="selectedPromotion?.old_designation || '-'" readonly></ui5-input>
      </div>

      <div class="flex flex-col gap-1">
        <ui5-label show-colon i18n>New Designation</ui5-label>
        <ui5-input class="w-full" [value]="selectedPromotion?.new_designation || '-'" readonly></ui5-input>
      </div>

      <div class="flex flex-col gap-1">
        <ui5-label show-colon i18n>Old Salary</ui5-label>
        <ui5-input class="w-full" [value]="formatNumber(selectedPromotion?.old_salary)" readonly></ui5-input>
      </div>

      <div class="flex flex-col gap-1">
        <ui5-label show-colon i18n>New Salary</ui5-label>
        <ui5-input
          class="w-full [&::part(inner)]:font-bold [&::part(inner)]:text-green-700 [&::part(root)]:bg-green-50"
          [value]="formatNumber(selectedPromotion?.new_salary)"
          readonly
        ></ui5-input>
      </div>

      <div class="flex flex-col gap-1">
        <ui5-label show-colon i18n>Promotion Date</ui5-label>
        <ui5-input class="w-full" [value]="formatDate(selectedPromotion?.promotion_date)" readonly></ui5-input>
      </div>

      <div class="flex flex-col gap-1">
        <ui5-label show-colon i18n>Effective Date</ui5-label>
        <ui5-input class="w-full" [value]="formatDate(selectedPromotion?.effective_date)" readonly></ui5-input>
      </div>

      <div class="flex flex-col gap-1">
        <ui5-label show-colon i18n>Executed By</ui5-label>
        <ui5-input class="w-full" [value]="selectedPromotion?.approved_by?.name || '-'" readonly></ui5-input>
      </div>

      <div class="col-span-2 flex flex-col gap-1">
        <ui5-label show-colon i18n>Note</ui5-label>
        <ui5-textarea class="w-full h-[50px]" [value]="selectedPromotion?.note || ''" readonly></ui5-textarea>
      </div>
    </div>

    <div class="mt-3 flex items-center justify-between rounded-lg border border-green-200 bg-green-50 px-5 py-3">
      <span class="text-sm font-medium text-green-800" i18n>Total Increment</span>
      <span class="text-lg font-bold text-green-800">
        {{ formatNumber(selectedPromotion?.salary_increment) }}
      </span>
    </div>
  </div>

  <div slot="footer" class="flex w-full items-center justify-end gap-2 border-t bg-gray-50 p-3">
    <ui5-button design="Transparent" (click)="closeDetails()">
      <span i18n>Close</span>
    </ui5-button>
  </div>
</ui5-dialog>
