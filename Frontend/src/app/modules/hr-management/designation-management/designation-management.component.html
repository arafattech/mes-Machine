<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    [columns]="columns"
    [isBase]="true"
    gridId="hr-designation"
    [showAction]="true"
    [showEditButton]="permission.hasPermission(permissions.HR_DESIGNATION_EDIT)"
    [showDeleteButton]="permission.hasPermission(permissions.HR_DESIGNATION_DELETE)"
    selectionMode="Single"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Designations Found"
    i18n-IllustratedTitle
    IllustratedSubtitle="Try adjusting your search or active status."
    i18n-IllustratedSubtitle
    (newButtonClick)="newDesignation()"
    (editClick)="editDesignation($event)"
    (deleteClick)="deleteClick($event.id)"
  ></app-ag-grid-table>
</div>

<ui5-dialog
  [open]="isDialogOpen"
  [attr.header-text]="
    this.saveMode === 'POST' ? localization.New : localization.Edit
  "
  (before-close)="CloseDialog()"
>
  <div class="flex flex-col">
    <div class="col-md-12">
      <ui5-label showColon class="w-100">{{ localization.Active }}</ui5-label>
      <ui5-switch checked [(ngModel)]="designation.is_active"></ui5-switch>
    </div>
    <ui5-label show-colon required i18n>Designation Name</ui5-label>
    <ui5-input
      class="w-100"
      [(ngModel)]="designation.name"
      placeholder="Enter designation name"
      (input)="checkValidation($event, 'name')"
      [attr.value-state]="valueStateOptions.name"
      type="Text"
      i18n-placeholder
    >
      <div slot="valueStateMessage">
        {{ validationMessage }}
      </div>
    </ui5-input>
  </div>

  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      (click)="saveDesignation()"
      [disabled]="isLoading"
      text="{{ localization.Submit }}"
    ></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="isLoading"
      (click)="CloseDialog()"
      text="{{ localization.Cancel }}"
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>

<app-delete-entity [IsDelete]="IsDelete" (isSuccess)="processData($event)">
</app-delete-entity>
