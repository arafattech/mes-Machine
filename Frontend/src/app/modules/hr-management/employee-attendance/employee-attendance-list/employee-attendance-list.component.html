<app-ag-grid-table
  #agGridRef
  [dataSource]="dataSource"
  [toolbarConfig]="toolbarConfig"
  [columns]="columns"
  [showAction]="true"
  [showEditButton]="isNewAttendanceButtonVisible && rolePermissionService.hasPermission(permissions.HR_ATTENDANCE_EDIT)"
  [showDeleteButton]="rolePermissionService.hasPermission(permissions.HR_ATTENDANCE_DELETE)"
  selectionMode="Single"
  gridId="hr-employee-attendance"
  [showIllustratedMessage]="true"
  IllustratedName="NoData"
  IllustratedTitle="No Attendance Records Found"
  i18n-IllustratedTitle
  [showDateRangePicker]="isNewAttendanceButtonVisible"
  [dateRangePickerValue]="dateRangeValue"
  [toolbarFilters]="isNewAttendanceButtonVisible ? employeeTypeToolbarFilters : []"
  (changeRangeDatePicker)="onDateRangeStringChange($event)"
  (toolbarAction)="onToolbarAction($event)"
  (resetButtonClick)="resetFilters()"
  (downloadButtonClick)="exportAttendances()"
  (newButtonClick)="newAttendance()"
  (editClick)="editAttendance($event)"
  (deleteClick)="IsDelete.emit('AttendanceLogs/' + $event.id)"
>
</app-ag-grid-table>

<app-delete-entity (isSuccess)="onDeleteSuccess()" [IsDelete]="IsDelete"></app-delete-entity>

<excel-upload-download
  *ngIf="isNewAttendanceButtonVisible"
  [exportApiUrl]="'hrm/attendance/export'"
  [exportPayload]="getAttendanceExportPayload()"
  [exportFileName]="getAttendanceExportFileName()"
  [IsExportXls]="IsExportXls"
></excel-upload-download>

<ui5-dialog class="ui5-xl-without-tab" [open]="open"
  [attr.header-text]="saveMode === 'POST' ? localization.New : localization.Edit" (before-close)="closeDialog()">
   <ui5-message-strip *ngIf="isOnApprovedLeave" (ui5Close)="isOnApprovedLeave = false" design="Critical" i18n>Employee in Leave</ui5-message-strip>
   <ui5-message-strip *ngIf="isHoliday && !isOnApprovedLeave" (ui5Close)="isHoliday = false" design="Critical" i18n>Employee In Holiday</ui5-message-strip>
    <ui5-message-strip *ngIf="showShiftError"
      [attr.design]="checkinShiftName ? (attendance.status === 'VALID' ? 'Positive' : attendance.status === 'LATE' ? 'Critical' : 'Negative') : 'Critical'"
      (ui5Close)="showShiftError = false">
      <ng-container *ngIf="checkinShiftName; else genericShiftError">{{ checkinShiftName }} (<ng-container [ngSwitch]="attendance.status"><span *ngSwitchCase="'VALID'" i18n>Valid</span><span *ngSwitchCase="'LATE'" i18n>Late</span><span *ngSwitchDefault i18n>Invalid</span></ng-container>)</ng-container>
      <ng-template #genericShiftError><span i18n>Employee not in shift this time</span></ng-template>
    </ui5-message-strip>
  <ui5-busy-indicator class="w-full" [delay]="0" [active]="loading" size="M">
    <section class="w-full">
      <ui5-label show-colon required i18n>Select Employee</ui5-label>
      <app-server-dropdown
        url="Employees"
        [searchFields]="['employee_no', 'first_name', 'last_name']"
        [filterQuery]="'is_active eq true'"
        [disabled]="saveMode === saveModeEnum.PUT"
        placeholder="Select a employee"
        i18n-placeholder
        [value]="employeeTitle || ''"
        [labelFn]="employeeLabelFn"
        (selectionChange)="onServerEmployeeChange($event)"
        class="w-full block"
      ></app-server-dropdown>

      <ui5-label show-colon required i18n>Attendance Date</ui5-label>
      <ui5-date-picker class="w-100" [(ngModel)]="attendance.attendance_date"
        (change)="onAttendanceDateChange($event); checkValidation($event, 'attendance_date')" [attr.value-state]="valueStateOptions.attendance_date"
        type="Date">
        <div slot="valueStateMessage">
          {{ validationMessage }}
        </div>
      </ui5-date-picker>

      <ui5-label show-colon required i18n>Check-In Time</ui5-label>
      <ui5-time-picker  format-pattern="hh:mm a" class="w-100" [(ngModel)]="attendance.check_in_time"
        (change)="checkValidation($event, 'check_in_time')" [attr.value-state]="valueStateOptions.check_in_time">
        <div slot="valueStateMessage">
          {{ validationMessage }}
        </div>
      </ui5-time-picker>

      <ui5-label show-colon i18n>Check-Out Time</ui5-label>
      <ui5-time-picker format-pattern="hh:mm a" class="w-100" [(ngModel)]="attendance.check_out_time"></ui5-time-picker>

    </section>
  </ui5-busy-indicator>

  <ui5-toolbar slot="footer">
    <ui5-toolbar-button design="Emphasized" (click)="saveAttendance()" [disabled]="loading || !isSubmitable"
      text="{{ localization.Submit }}">
    </ui5-toolbar-button>
    <ui5-toolbar-button design="Transparent" [disabled]="loading" (click)="closeDialog()"
      text="{{ localization.Cancel }}">
    </ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
