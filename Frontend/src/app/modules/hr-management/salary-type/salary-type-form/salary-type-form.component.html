<ui5-dialog
  class="ui5-xl-without-tab"
  [open]="open"
  [attr.header-text]="
    this.saveMode === 'POST' ? localization.New : localization.Edit
  "
  (before-close)="CloseDialog()"
>
  <ui5-busy-indicator class="w-full" [delay]="0" [active]="loading" size="M">
    <section class="w-full">
      <div class="flex flex-col">
        <ui5-label show-colon class="w-100">{{
          localization.Active
        }}</ui5-label>
        <ui5-switch checked [(ngModel)]="salaryType.is_active"></ui5-switch>
      </div>
      <ui5-label show-colon required i18n>Name</ui5-label>
      <ui5-input
        class="w-100"
        [value]="salaryType.name"
        (input)="salaryType.name = $any($event.target).value"
        placeholder="Enter Salary Type"
        [attr.value-state]="valueStateOptions.name"
        type="Text"
      >
        <div slot="valueStateMessage">
          {{ validationMessage }}
        </div>
      </ui5-input>

      <div class="py-1">
        <ui5-label show-colon required i18n>Type</ui5-label>
        <ui5-combobox  (selection-change)="onTypeChange($event)" placeholder="Select Type" class="w-100">
          <ui5-cb-item  text="earning"></ui5-cb-item>
          <ui5-cb-item text="deduction"></ui5-cb-item>
        </ui5-combobox>
      </div>
    </section>
  </ui5-busy-indicator>
  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      (click)="onSaveType()"
      [disabled]="loading"
      text="{{ localization.Submit }}"
    ></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="loading"
      (click)="CloseDialog()"
      text="{{ localization.Cancel }}"
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
