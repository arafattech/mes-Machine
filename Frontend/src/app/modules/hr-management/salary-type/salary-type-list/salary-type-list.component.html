<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    [columns]="columns"
    [isBase]="true"
    gridId="hr-salary-type"
    [showAction]="true"
    [showEditButton]="true"
    [showDeleteButton]="true"
    selectionMode="Single"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Salary Types Found"
    i18n-IllustratedTitle
    (newButtonClick)="newSalaryType()"
    (editClick)="editSalaryType($event)"
    (deleteClick)="deleteClick($event.id)"
  ></app-ag-grid-table>
</div>

<app-delete-entity (isSuccess)="processData($event)" [IsDelete]="IsDelete">
</app-delete-entity>

<app-salary-type-form
  #salaryTypeForm
  [saveMode]="saveMode"
  [salaryType]="salaryType"
  (RefreshTable)="processData($event)"
></app-salary-type-form>
