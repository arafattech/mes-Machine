<div class="w-full">
    <div class="flex items-center justify-between w-full mb-4">
        <ui5-button design="Emphasized" (click)="openModal.emit()">
            {{ newButtonText }}
        </ui5-button>
    </div>

    <ui5-illustrated-message *ngIf="items.length === 0" name="NoData" class="mt-10 mx-auto"></ui5-illustrated-message>

    <div class="row" *ngIf="items.length > 0">
        <div class="col-md-6 mb-5" *ngFor="let item of items; let i = index">
            <div class="w-full bg-white rounded-2xl shadow-md border border-gray-200">
                <div
                    class="flex items-center justify-between px-5 py-4 bg-blue-50 rounded-t-2xl border-b border-gray-100">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-sm">
                            <ui5-avatar [icon]="icon" size="XS"></ui5-avatar>
                        </div>
                        <div>
                            <div class="text-base font-semibold text-gray-800">
                                {{ item[fields[0].key] || defaultTitle }}
                            </div>
                            <div *ngIf="fields.length > 1" class="text-xs text-gray-500">
                                {{ item[fields[1].key] }}
                            </div>
                        </div>
                    </div>

                    <div slot="action" class="flex items-center gap-1">
                        <ui5-button icon="edit" design="Transparent" tooltip="Edit" class="!py-1 !px-2"
                            (click)="editItem.emit([item, i])"></ui5-button>
                        <ui5-button 
                        *ngIf="rolePermissionService.hasPermission(permissions.BASE_DATA_SUPPLIER_BANK_DELETE)"
                        icon="delete" design="Transparent" class="float-right"
                            (click)="item.id ? deleteItemFromServer.emit(i) : deleteItemLocal.emit(i)">
                        </ui5-button>

                    </div>
                </div>

                <div class="px-5 py-4 text-sm text-gray-700 space-y-2">
                    <div class="grid grid-cols-2 gap-y-2">
                        <ng-container *ngFor="let field of fields">
                            <div class="font-medium text-gray-600">{{ field.label }}</div>
                            <div class="text-right text-gray-800">
                                {{ field.format === 'date' ? (item[field.key] | date:'dd-MM-yyyy') : item[field.key] }}
                            </div>
                        </ng-container>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
