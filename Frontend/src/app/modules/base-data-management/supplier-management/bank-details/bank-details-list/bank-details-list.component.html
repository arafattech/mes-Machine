<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [columns]="columns"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    [segmentButtonItems]="segmentButtonItems"
    selectionMode="Single"
    [isBase]="true"
    gridId="base-data-supplier-bank-details"
    [showAction]="true"
    [editPermission]="true"
    [showEditButton]="false"
    [showDeleteButton]="false"
    [customActionButtons]="actionButtons"
  ></app-ag-grid-table>
</div>

<app-bank-details
  [isOpen]="IsApprove"
  [SupplierBankInfo]="Supplier_Info"
  [approvedAt]="approvedAt"
  [createdBy]="createdBy"
  (isSuccessChange)="onSuccessChange()"
>
</app-bank-details>
