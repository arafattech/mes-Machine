<ui5-dialog
  [open]="open"
  class="ui5-xl-dialoge w-[90vh] h-[90vh] max-w-none p-0 overflow-hidden"
  [attr.header-text]="'Select Employee'"
  (before-close)="closeDialog()"
>
  <div *ngIf="open" class="w-full h-[calc(90vh-120px)] overflow-hidden">
    <app-ag-grid-table
      [columns]="columns"
      [dataSource]="dataSource"
      [toolbarConfig]="toolbarConfig"
      [isBase]="false"
      [selectionMode]="'Multiple'"
      [selectionRowBehavior]="'Row'"
      [showAction]="false"
      (selectionChanged)="onRowSelect($event)"
      (cellEdited)="onCellEdited($event)"
    ></app-ag-grid-table>
  </div>
  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      [disabled]="loading"
      text="{{ localization.Submit }}"
      (click)="save()"
    ></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="loading"
      (click)="closeDialog()"
      text="{{ localization.Cancel }}"
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
