<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [columns]="columns"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    selectionMode="Single"
    [isBase]="true"
    [gridId]="gridId"
    [showAction]="true"
    [showEditButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_ASSET_GROUP_EDIT)"
    [showDeleteButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_ASSET_GROUP_DELETE)"
    (newButtonClick)="newAssetGroup()"
    (editClick)="editAssetGroup($event)"
    (deleteClick)="deleteClick($event.id)"
    (rowClick)="editAssetGroup($event)"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Asset Groups Found"
    IllustratedSubtitle="Try adjusting your search or active status."
  ></app-ag-grid-table>
</div>

<app-asset-group-form
  #assetsGroupForm
  [saveMode]="saveMode"
  (RefreshTable)="processData($event)"
></app-asset-group-form>

<app-delete-entity [IsDelete]="IsDelete" (isSuccess)="processData($event)">
</app-delete-entity>
