<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [columns]="columns"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    selectionMode="Single"
    [isBase]="true"
    [gridId]="gridId"
    [showAction]="true"
    [showEditButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_PLANT_EDIT)"
    [showDeleteButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_PLANT_DELETE)"
    (newButtonClick)="newPlant()"
    (editClick)="editPlant($event)"
    (deleteClick)="deleteClick($event.id)"
    (rowClick)="editPlant($event)"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Asset Groups Found"
    IllustratedSubtitle="Try adjusting your search or active status."
  ></app-ag-grid-table>
</div>

<app-delete-entity (isSuccess)="processData($event)" [IsDelete]="IsDelete">
</app-delete-entity>

<app-plant-form
  #plantForm
  [saveMode]="saveMode"
  [plant]="plant"
  (RefreshTable)="processData($event)"
></app-plant-form>
