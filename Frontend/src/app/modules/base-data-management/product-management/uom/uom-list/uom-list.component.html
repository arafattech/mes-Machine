<app-ag-grid-table
  #agGridRef
  [columns]="columns"
  [dataSource]="dataSource"
  [toolbarConfig]="toolbarConfig"
  selectionMode="Single"
  [isBase]="true"
  [gridId]="gridId"
  [showAction]="true"
  [showEditButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_UOM_EDIT)"
  [showDeleteButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_UOM_DELETE)"
  (newButtonClick)="newUom()"
  (editClick)="editUom($event)"
  (deleteClick)="deleteClick($event.id)"
  (rowClick)="editUom($event)"
  [showIllustratedMessage]="true"
  IllustratedName="NoData"
  IllustratedTitle="No UOMs Found"
  IllustratedSubtitle="Try adjusting your search or active status."
></app-ag-grid-table>

<app-delete-entity (isSuccess)="processData($event)" [IsDelete]="IsDelete">
</app-delete-entity>

<app-uom-form
  #uomForm
  [saveMode]="saveMode"
  [uom]="uom"
  (RefreshTable)="processData($event)"
></app-uom-form>
