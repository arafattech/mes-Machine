<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [columns]="columns"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    selectionMode="Single"
    [isBase]="true"
    [gridId]="gridId"
    [showAction]="true"
    [showEditButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_ITEM_CATEGORY_EDIT)"
    [showDeleteButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_ITEM_CATEGORY_DELETE)"
    (newButtonClick)="newCategory()"
    (editClick)="editCatogry($event)"
    (deleteClick)="deleteClick($event.id)"
    (rowClick)="editCatogry($event)"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Item Categories Found"
    IllustratedSubtitle="Try adjusting your search or active status."
  ></app-ag-grid-table>
</div>

<app-category-form
  #categoryForm
  [saveMode]="saveMode"
  [itemCategory]="itemCategory"
  (RefreshTable)="processData($event)"
></app-category-form>

<app-delete-entity [IsDelete]="IsDelete" (isSuccess)="processData($event)">
</app-delete-entity>
