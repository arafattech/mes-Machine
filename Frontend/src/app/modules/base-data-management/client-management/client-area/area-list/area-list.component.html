<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [columns]="columns"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    selectionMode="Single"
    [isBase]="true"
    [gridId]="gridId"
    [showAction]="true"
    [showEditButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_CLIENT_AREA_EDIT)"
    [showDeleteButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_CLIENT_AREA_DELETE)"
    (newButtonClick)="newClientArea()"
    (editClick)="editClientArea($event)"
    (deleteClick)="deleteClick($event.id)"
    (rowClick)="editClientArea($event)"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Asset Groups Found"
    IllustratedSubtitle="Try adjusting your search or active status."
  ></app-ag-grid-table>
</div>

<app-client-area-form
  #clientAreaForm
  [saveMode]="saveMode"
  [clientArea]="clientArea"
  (RefreshTable)="processData($event)"
></app-client-area-form>

<app-delete-entity
  [IsDelete]="IsDelete"
  (isSuccess)="processData()"
></app-delete-entity>
