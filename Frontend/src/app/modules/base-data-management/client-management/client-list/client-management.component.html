<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [columns]="columns"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    selectionMode="Single"
    [isBase]="true"
    [gridId]="gridId"
    [showAction]="true"
    [showEditButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_CLIENT_EDIT)"
    [showDeleteButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_CLIENT_DELETE)"
    (newButtonClick)="newClient()"
    (editClick)="editClient($event)"
    (deleteClick)="deleteClick($event.id)"
    (rowClick)="editClient($event)"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Asset Groups Found"
    IllustratedSubtitle="Try adjusting your search or active status."
  ></app-ag-grid-table>
</div>

<app-delete-entity (isSuccess)="processData()" [IsDelete]="IsDelete">
</app-delete-entity>

<app-client-form
  #clientForm
  [saveMode]="saveMode"
  [client]="client"
  (RefreshTable)="processData($event)"
></app-client-form>
