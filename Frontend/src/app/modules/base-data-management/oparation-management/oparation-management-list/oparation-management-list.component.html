<app-ag-grid-table
  #agGridRef
  [columns]="columns"
  [dataSource]="dataSource"
  [toolbarConfig]="toolbarConfig"
  selectionMode="Single"
  [isBase]="true"
  [gridId]="gridId"
  [showAction]="false"
  [showNewButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_OPERATION_CREATE)"
  (newButtonClick)="newOperation()"
  (rowClick)="editOperation($event)"
  [showIllustratedMessage]="true"
  IllustratedName="NoData"
  IllustratedTitle="No Operations Found"
  IllustratedSubtitle="Try adjusting your search or active status."
></app-ag-grid-table>

<app-delete-entity (isSuccess)="processData($event)" [IsDelete]="IsDelete">
</app-delete-entity>

<app-operation-management-form
  #operationForm
  (RefreshTable)="processData($event)"
></app-operation-management-form>
