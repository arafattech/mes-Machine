<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [columns]="columns"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    selectionMode="Single"
    [isBase]="true"
    gridId="base-data-user-list"
    [showAction]="true"
    [editPermission]="true"
    [showEditButton]="false"
    [showDeleteButton]="false"
    [customActionButtons]="actionButtons"
    (newButtonClick)="newUser()"
  ></app-ag-grid-table>
</div>

<app-user-form
  #userForm
  [saveMode]="saveMode"
  [user]="Users"
  (RefreshTable)="processData($event)"
></app-user-form>

<app-delete-entity [IsDelete]="IsDelete" (isSuccess)="processData($event)">
</app-delete-entity>
