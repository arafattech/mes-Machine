<ui5-dialog
  [open]="open"
  class="ui5-xl-without-tab"
  [attr.header-text]="
    this.saveMode === 'POST' ? localization.New : localization.Edit
  "(before-close)="CloseDialog()"
>
  <ui5-busy-indicator [delay]="0" [active]="loading" size="M" class="w-full">
    <section class="w-full">
      <div class="col-md-12">
        <ui5-label showColon class="w-100">{{ localization.Active }}</ui5-label>
        <ui5-switch checked [(ngModel)]="machineState.is_active"></ui5-switch>
      </div>
      <ui5-label show-colon required i18n>Name</ui5-label>
      <ui5-input
        class="w-100"
        [(ngModel)]="machineState.name"
        placeholder="Enter state name"
        (input)="checkValidation($event)"
        [attr.value-state]="valueStateOptions.name"
        type="Text"
        i18n-placeholder
      >
        <div slot="valueStateMessage">
          {{ validationMessage }}
        </div>
      </ui5-input>

      <ui5-label show-colon i18n>Icon</ui5-label>
      <div class="flex items-center gap-2 w-full">
        <ui5-select class="flex-1" (change)="onIconChange($event)">
          <ui5-option
            *ngFor="let icon of iconOptions"
            [attr.value]="icon"
            [selected]="machineState.icon === icon"
          >{{ icon }}</ui5-option>
        </ui5-select>
        <ui5-icon *ngIf="machineState.icon" [name]="machineState.icon" [style.color]="machineState.color || 'inherit'"></ui5-icon>
      </div>

      <ui5-label show-colon i18n>Color</ui5-label>
      <div class="flex items-center gap-2 w-full">
        <div
          class="rounded h-6 flex-[0_0_80%]"
          [style.background-color]="machineState.color || 'rgb(0, 128, 0)'"
        ></div>
        <ui5-button
          class="flex-[0_0_20%]"
          design="Emphasized"
          (click)="openColorPickerDialog()" i18n>Select
        </ui5-button>
      </div>
      <ui5-dialog
        [open]="colorDialogOpen"
        header-text="Select Color"
        (before-close)="closeColorPickerDialog()"
      >
        <ui5-color-picker
          [value]="machineState.color || 'rgb(0, 128, 0)'"
          (change)="onColorPickerChange($event)"
        >
        </ui5-color-picker>
        <ui5-toolbar slot="footer">
          <ui5-toolbar-button design="Emphasized" (click)="confirmColor()" text="{{ localization.Confirm }}">
          </ui5-toolbar-button>
          <ui5-toolbar-button design="Transparent" (click)="closeColorPickerDialog()" text="{{ localization.Cancel }}">
          </ui5-toolbar-button>
        </ui5-toolbar>
      </ui5-dialog>
    </section>
  </ui5-busy-indicator>
  <ui5-toolbar slot="footer">
    <ui5-toolbar-button
      design="Emphasized"
      (click)="AddState()"
      [disabled]="loading"
      text="{{ localization.Submit }}"
    ></ui5-toolbar-button>
    <ui5-toolbar-button
      design="Transparent"
      [disabled]="loading"
      (click)="CloseDialog()"
      text="{{ localization.Cancel }}"
    ></ui5-toolbar-button>
  </ui5-toolbar>
</ui5-dialog>
