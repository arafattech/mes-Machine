<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [columns]="columns"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    selectionMode="Single"
    [isBase]="true"
    [gridId]="gridId"
    [showAction]="true"
    [showEditButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_MACHINE_STATE_EDIT)"
    [showDeleteButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_MACHINE_STATE_DELETE)"
    (newButtonClick)="newMachineState()"
    (editClick)="editMachineState($event)"
    (deleteClick)="deleteClick($event.id)"
    (rowClick)="editMachineState($event)"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Machine States Found"
    IllustratedSubtitle="Try adjusting your search or active status."
  ></app-ag-grid-table>
</div>

<app-delete-entity [IsDelete]="IsDelete" (isSuccess)="processData()"></app-delete-entity>

<app-machine-state-form
  #machineStateForm
  [saveMode]="saveMode"
  [machineState]="MachineState"
  (RefreshTable)="processData($event)"
></app-machine-state-form>
