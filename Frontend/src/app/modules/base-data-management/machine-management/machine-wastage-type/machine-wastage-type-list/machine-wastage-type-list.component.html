<div class="h-[calc(100vh-55px)]">
  <app-ag-grid-table
    #agGridRef
    [columns]="columns"
    [dataSource]="dataSource"
    [toolbarConfig]="toolbarConfig"
    selectionMode="Single"
    [isBase]="true"
    [gridId]="gridId"
    [showAction]="true"
    [showEditButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_MACHINE_WASTAGE_TYPE_EDIT)"
    [showDeleteButton]="rolePermissionService.hasPermission(permissions.BASE_DATA_MACHINE_WASTAGE_TYPE_DELETE)"
    (newButtonClick)="newMachineWastageType()"
    (editClick)="editMachineWastageType($event)"
    (deleteClick)="deleteClick($event.id)"
    (rowClick)="editMachineWastageType($event)"
    [showIllustratedMessage]="true"
    IllustratedName="NoData"
    IllustratedTitle="No Machine Wastage Types Found"
    IllustratedSubtitle="Try adjusting your search or active status."
  ></app-ag-grid-table>
</div>

<app-machine-wastage-type-form
  #machineWastageTypeForm
  [saveMode]="saveMode"
  [machineWastageType]="machineWastageType"
  (RefreshTable)="processData($event)"
></app-machine-wastage-type-form>

<app-delete-entity
  (isSuccess)="processData($event)"
  [IsDelete]="IsDelete"
></app-delete-entity>
